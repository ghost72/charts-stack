async function checkLastfmTag(q) {
  const box = document.getElementById("lf-tag-results");
  if (!box) return;
  box.innerHTML = `<div class="muted-txt">${t("finder.checking")}</div>`;
  try {
    const r = await fetch("/api/sources/lastfm/tag?q=" + encodeURIComponent(q),
      {cache: "no-store"});
    const d = await r.json();
    if (d && d.ok) {
      const samples = (d.sample || []).map(s => `<li>${esc(s)}</li>`).join("");
      // Show the real tag total honestly; fall back to a plain "valid" line
      // when Last.fm did not report a numeric total.
      const headline = (d.total != null)
        ? t("finder.lastfm.hit", {tag: esc(d.tag), total: esc(d.total)})
        : t("finder.lastfm.valid", {tag: esc(d.tag)});
      box.innerHTML =
        `<div class="lf-hit">${headline}</div>` +
        (samples ? `<ul class="lf-samples">${samples}</ul>` : "") +
        snippetCell(d.snippet);
    } else {
      box.innerHTML = `<div class="s-err">${esc((d && d.detail) || t("finder.generic_error"))}</div>`;
    }
  } catch (e) {
    box.innerHTML = `<div class="s-err">${t("finder.unreachable")}</div>`;
  }
}

// Loads the read-only Energy channel list and renders it as a sortable table.
// Fail-open like searchDeezerPlaylists: any non-OK / !ok / empty result shows
// the energy.unreachable message instead of throwing. Status is a badge span,
// snippet is the shared snippetCell() markup.
async function loadEnergyChannels() {
  const box = document.getElementById("energy-channels");
  if (!box) return;
  try {
    const r = await fetch("/api/sources/energy/channels", {cache: "no-store"});
    const d = await r.json();
    if (!r.ok || !d || !d.ok || !Array.isArray(d.channels) || !d.channels.length) {
      box.innerHTML = `<div class="muted-txt">${t("energy.unreachable")}</div>`;
      return;
    }
    renderSortableTable(box, d.channels, [
      {label: t("energy.col.channel"), get: c => c.display, type: "string", sortable: true},
      {label: t("energy.col.slug"), get: c => c.slug, type: "string", sortable: true},
      {label: t("energy.col.genre"), get: c => c.genre, type: "string", sortable: true},
      {label: t("energy.col.mode"), get: c => c.mode, type: "string", sortable: true},
      {label: t("energy.col.status"), type: "raw", sortable: false, get: c => {
        const cls = c.active ? "active" : "inactive";
        const txt = c.active ? t("energy.status.active", {mode: c.active_mode})
                             : t("energy.status.inactive");
        let out = `<span class="nrj-badge ${cls}">${esc(txt)}</span>`;
        // G2 liveness badge (read-only): "live"/"dead" from the daily re-probe.
        // "unknown" (no map yet / energy disabled) renders no badge.
        if (c.liveness === "live" || c.liveness === "dead") {
          const lcls = c.liveness === "live" ? "live" : "dead";
          const ltxt = t("energy.liveness." + c.liveness);
          out += ` <span class="nrj-badge ${lcls}" title="${esc(t("energy.liveness.hint"))}">${esc(ltxt)}</span>`;
        }
        return out;
      }},
      {label: t("energy.col.snippet"), get: c => snippetCell(c.snippet), type: "raw", sortable: false},
    ], 0);   // default sort: Channel, ascending by name feel (descending glyph)
  } catch (e) {
    box.innerHTML = `<div class="muted-txt">${t("energy.unreachable")}</div>`;
  }
}

function initFinder(lastfm) {
  // Gray out the Last.fm part when no API key is configured. This cannot change
  // at runtime, but we set it idempotently.
  const lfBox = document.getElementById("lf-tag-box");
  if (lfBox) {
    if (lastfm.configured === false) {
      lfBox.classList.add("muted");
      if (!lfBox.querySelector(".lf-nokey")) {
        const hint = document.createElement("div");
        hint.className = "lf-nokey muted-txt";
        hint.textContent = t("finder.lastfm.needs_key");
        lfBox.appendChild(hint);
      }
    } else {
      lfBox.classList.remove("muted");
      const hint = lfBox.querySelector(".lf-nokey");
      if (hint) hint.remove();
    }
  }

  if (_finderDone) return;      // wire up the rest only ONCE
  _finderDone = true;

  // Fill the genre table once.
  loadGenres();

  // Build the chips.
  const chipsEl = document.getElementById("lf-chips");
  if (chipsEl) {
    chipsEl.innerHTML = STATIC_TAGS.map(t =>
      `<button type="button" class="chip" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
    chipsEl.addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      const tag = b.getAttribute("data-tag");
      const inp = document.getElementById("lf-tag-q");
      if (inp) inp.value = tag;
      checkLastfmTag(tag);
    });
  }

  // Form submits.
  const dzForm = document.getElementById("dz-pl-form");
  if (dzForm) {
    dzForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = (document.getElementById("dz-pl-q").value || "").trim();
      if (q) searchDeezerPlaylists(q);
    });
  }
  const dzArForm = document.getElementById("dz-ar-form");
  if (dzArForm) {
    dzArForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = (document.getElementById("dz-ar-q").value || "").trim();
      if (q) searchDeezerArtists(q);
    });
  }
  const lfForm = document.getElementById("lf-tag-form");
  if (lfForm) {
    lfForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = (document.getElementById("lf-tag-q").value || "").trim();
      if (q) checkLastfmTag(q);
    });
  }

  // Copy buttons (delegation across the whole finder section).
  const finder = document.querySelector(".finder");
  if (finder) {
    finder.addEventListener("click", (e) => {
      const b = e.target.closest(".snip-copy");
      if (!b) return;
      // A button carries exactly one of the two attributes: the block button
      // the pretty JSON, the line button the compact snippet.
      const text = b.getAttribute("data-snip-block") ?? b.getAttribute("data-snip-line");
      copySnippet(text, b);
    });
  }

  // Load the Energy channel browser once. It sits OUTSIDE the .finder section,
  // so its copy buttons need their own identical .snip-copy delegation bound to
  // the energy results container (the finder delegation above does not reach it).
  loadEnergyChannels();
  const energyBox = document.getElementById("energy-channels");
  if (energyBox) {
    energyBox.addEventListener("click", (e) => {
      const b = e.target.closest(".snip-copy");
      if (!b) return;
      // Identical read to the finder delegation: block attribute if present,
      // otherwise the compact line.
      const text = b.getAttribute("data-snip-block") ?? b.getAttribute("data-snip-line");
      copySnippet(text, b);
    });
  }
}

// --- Manual tag editor ------------------------------------------------------
// Live autocomplete search over the library + manifest, per-field edit with a
// colored border on changed fields, and cover replace via upload or URL. Save
// posts the whole multipart form; the server re-verifies which fields changed
// and clears the stack provenance markers. Wired up once from the bootstrap.
let _teDone = false;
const TE_FIELDS = ["artist", "title", "album", "year", "track"];

function initTagEditor() {
  if (_teDone) return;
  _teDone = true;
  const input = document.getElementById("te-search");
  const results = document.getElementById("te-results");
  const hint = document.getElementById("te-hint");
  const form = document.getElementById("te-form");
  if (!input || !results || !form) return;

  let debounce = null;
  let ctrl = null;          // AbortController for the in-flight search

  async function doSearch(q) {
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    results.innerHTML = `<div class="muted-txt">${t("tageditor.searching")}</div>`;
    try {
      const r = await fetch("/api/tageditor/search?q=" + encodeURIComponent(q),
        {cache: "no-store", signal: ctrl.signal});
      const d = await r.json();
      if (!d || !d.ok) { results.innerHTML = ""; return; }
      if (!d.results.length) {
        results.innerHTML = `<div class="te-no-hits">${t("tageditor.no_hits")}</div>`;
        return;
      }
      results.innerHTML = d.results.map(s => {
        const badgeCls = s.origin === "stack" ? "badge-stack" : "badge-curated";
        const badgeTxt = t("tageditor.origin." + (s.origin === "stack" ? "stack" : "curated"));
        return `<div class="te-row" data-path="${esc(s.path)}">` +
          `<span class="te-row-main">${esc(s.artist)} — ${esc(s.title)}</span>` +
          `<span class="te-row-album">${esc(s.album)}</span>` +
          `<span class="badge ${badgeCls}">${esc(badgeTxt)}</span></div>`;
      }).join("");
    } catch (e) {
      if (e.name === "AbortError") return;    // superseded keystroke
      results.innerHTML = `<div class="s-err">${t("tageditor.unreachable")}</div>`;
    }
  }

  input.addEventListener("input", () => {
    // A fresh Tag-Editor interaction clears a lingering delete/restore success
    // message (the user is back working in the editor).
    clearTagEditorSuccessMsg();
    const q = (input.value || "").trim();
    if (debounce) clearTimeout(debounce);
    if (q.length < 2) { results.innerHTML = ""; return; }
    debounce = setTimeout(() => doSearch(q), 250);
  });
  // Also clear the transient success message when the user focuses the search
  // box again (clicks back into the Tag-Editor) even before typing.
  input.addEventListener("focus", () => clearTagEditorSuccessMsg());

  results.addEventListener("click", (e) => {
    const row = e.target.closest(".te-row");
    if (!row) return;
    loadSong(row.getAttribute("data-path"));
  });

  async function loadSong(path) {
    // Picking a song is a fresh Tag-Editor interaction: drop a lingering
    // delete/restore success message before loading the new song.
    clearTagEditorSuccessMsg();
    try {
      const r = await fetch("/api/tageditor/song?path=" + encodeURIComponent(path),
        {cache: "no-store"});
      const d = await r.json();
      if (!d || !d.ok) {
        setMsg(esc((d && d.error) || t("tageditor.unreachable")), true);
        return;
      }
      prefill(d.song);
    } catch (e) {
      setMsg(t("tageditor.unreachable"), true);
    }
  }

  function prefill(song) {
    document.getElementById("te-path").value = song.path;
    TE_FIELDS.forEach(f => {
      const el = document.getElementById("te-" + f);
      el.value = song[f] == null ? "" : String(song[f]);
      el.dataset.orig = el.value;
      el.classList.remove("changed");
    });
    // Reset the "file will be moved" hint (shown only while the artist field
    // differs from its loaded value).
    const artistHint = document.getElementById("te-artist-hint");
    if (artistHint) artistHint.hidden = true;
    // Cover preview + reset the cover inputs. ALWAYS reset the image first so a
    // newly selected song never shows the previous song's cover: clear the src
    // and hide the img, THEN show the new cover only if this song has one.
    // Placeholder-vs-image is mutually exclusive — the [hidden] img drives the
    // CSS :has() that reveals the music-note placeholder.
    const img = document.getElementById("te-cover-img");
    img.src = ""; img.removeAttribute("src"); img.hidden = true;
    if (song.cover && song.cover.present && song.cover.data_url) {
      img.src = song.cover.data_url; img.hidden = false;
    }
    // Cover-Download control (head row): shown ONLY when the song HAS an
    // embedded cover (present === true), INCLUDING the oversize case where the
    // inline preview is suppressed but a full cover exists and is downloadable.
    // Hidden when there is no embedded cover (present === false). Clicking
    // fetches the FULL original-resolution cover via GET /api/tageditor/cover
    // (auth-gated, independent of the preview size cap).
    const coverDl = document.getElementById("te-cover-dl");
    if (coverDl) {
      if (song.cover && song.cover.present) {
        coverDl.href = "/api/tageditor/cover?path=" + encodeURIComponent(song.path);
        coverDl.hidden = false;
      } else {
        coverDl.hidden = true; coverDl.removeAttribute("href");
      }
    }
    const fileEl = document.getElementById("te-cover-file");
    const urlEl = document.getElementById("te-cover-url");
    fileEl.value = ""; urlEl.value = "";
    fileEl.classList.remove("changed"); urlEl.classList.remove("changed");
    // Read-only file path + bitrate/format row (always on). The label is
    // composed on the client from i18n: a lossless ext shows "<FORMAT>
    // (lossless)", otherwise "<n> kbps" (or "—" when the bitrate is unknown).
    const fiVal = document.getElementById("te-fileinfo-val");
    if (fiVal) {
      let label;
      if (song.is_lossless) {
        const fmt = (song.ext || "").replace(/^\./, "").toUpperCase() || "?";
        label = t("tageditor.fileinfo.lossless", {format: fmt});
      } else if (song.bitrate_kbps) {
        label = t("tageditor.fileinfo.kbps", {kbps: song.bitrate_kbps});
      } else {
        label = "—";
      }
      const rel = song.rel_path == null ? "" : String(song.rel_path);
      fiVal.textContent = rel ? (rel + " · " + label) : label;
    }
    // Play overlay + download button (items 3+4): only when the server flag
    // TAGEDITOR_AUDIO_ENABLED is on (song.audio_enabled). ALWAYS reset the
    // <audio> element first so the previous song never keeps playing.
    const playBtn = document.getElementById("te-play");
    const audioEl = document.getElementById("te-audio");
    const dlLink = document.getElementById("te-download");
    if (audioEl) { audioEl.pause(); audioEl.removeAttribute("src"); audioEl.load(); }
    if (playBtn) setPlayGlyph(playBtn, "▶");
    if (!song.audio_enabled) {
      // Flag off (default): render NO play/download controls at all.
      if (playBtn) playBtn.hidden = true;
      if (dlLink) { dlLink.hidden = true; dlLink.removeAttribute("href"); }
    } else {
      const src = "/api/tageditor/audio?path=" + encodeURIComponent(song.path);
      if (dlLink) {
        dlLink.href = src + "&download=1";   // works for ALL formats incl. FLAC
        dlLink.hidden = false;
      }
      if (playBtn) {
        playBtn.hidden = false;
        playBtn.disabled = !song.playable;   // MP3 only (browsers may not do FLAC)
        // Set the tooltip on EVERY load (the one-shot static sweep cannot know
        // the per-song playable state): MP3 -> "Play", FLAC -> "MP3 only".
        playBtn.title = t(song.playable ? "tageditor.play.title"
                                        : "tageditor.play.mp3only");
        playBtn.dataset.src = song.playable ? src : "";
      }
    }
    // Non-MP3 files are read-only: disable every control + show the note.
    const readOnly = song.is_mp3 === false;
    const note = document.getElementById("te-mp3only");
    note.hidden = !readOnly;
    // Convert button: shown ONLY for a loaded non-MP3 song. Driven purely by
    // song.is_mp3 === false - NEVER by song.audio_enabled - so it is reachable
    // with the TAGEDITOR_AUDIO_ENABLED flag OFF (the convert route is
    // auth-gated, not flag-gated). Independent of the audio_enabled branch
    // above; the two code paths never touch each other.
    // Prefer the explicit server flag; fall back to the extension so a payload
    // that omits is_mp3 (older server build) still reveals Convert for non-MP3
    // files. is_mp3 === true OR (is_mp3 absent AND ext is .mp3) => not
    // convertible; everything else (a non-MP3 file) shows the button.
    const convertExt = (song.ext || "").toLowerCase();
    const convertIsMp3 = (song.is_mp3 === true) ||
                         (song.is_mp3 === undefined && convertExt === ".mp3");
    const convertBtn = document.getElementById("te-convert");
    if (convertBtn) convertBtn.hidden = convertIsMp3;
    // Delete button: always available for a loaded song (any audio format, not
    // MP3-only). Stash the current path + rel_path on its dataset so the confirm
    // handler can show the honest rel_path and POST the absolute path. It is NOT
    // disabled for read-only (non-MP3) files: delete works for whatever loaded.
    const deleteBtn = document.getElementById("te-delete");
    if (deleteBtn) {
      deleteBtn.dataset.path = song.path || "";
      deleteBtn.dataset.rel = song.rel_path == null ? "" : String(song.rel_path);
    }
    [...TE_FIELDS.map(f => "te-" + f), "te-cover-file", "te-cover-url"].forEach(id => {
      document.getElementById(id).disabled = readOnly;
    });
    form.querySelector("button[type=submit]").disabled = readOnly;
    setMsg("", false);
    form.hidden = false;
    if (hint) hint.hidden = true;
  }

  function setMsg(text, isErr) {
    const msg = document.getElementById("te-msg");
    msg.textContent = text;
    msg.className = "te-msg" + (isErr ? " err" : " ok");
  }

  // Render a delete/restore SUCCESS message into #te-msg with NEUTRAL styling:
  // the sentence text is normal white (.te-success-neutral) and the path sits
  // in a bordered .te-pathchip whose border is tinted by action (red delete /
  // green restore) via the `variant` modifier. Used for the restore success
  // message (the delete one goes through resetEditor, which tags #te-hint
  // neutral the same way). The message is transient: it is cleared on the next
  // tab-switch or Tag-Editor interaction.
  function setSuccessPathMsg(key, path, variant) {
    const msg = document.getElementById("te-msg");
    msg.innerHTML = pathMsgHtml(key, path, variant);
    msg.className = "te-msg te-success-neutral";
  }

  // Build a success message HTML fragment from an i18n template that contains a
  // {path} placeholder, rendering the substituted path inside a bordered
  // .te-pathchip span. `variant` ("del" | "restore") adds a modifier class that
  // tints only the chip BORDER (red for delete, green for restore); the chip
  // text and the surrounding sentence stay normal white. SECURITY: the path is
  // a filesystem path from the server, so it is HTML-escaped before injection;
  // the template's own literal segments are escaped too, and only the chip
  // markup is trusted. Split/join on {path} mirrors the t() substitution so the
  // human sentence stays intact.
  function pathMsgHtml(key, path, variant) {
    const tmpl = t(key);                       // raw template, {path} unexpanded
    const parts = tmpl.split("{path}");
    const mod = variant ? " te-pathchip-" + variant : "";
    const chip = `<span class="te-pathchip${mod}">${esc(path)}</span>`;
    return parts.map(esc).join(chip);
  }

  // Changed-field highlight (advisory; the server re-verifies).
  TE_FIELDS.forEach(f => {
    const el = document.getElementById("te-" + f);
    el.addEventListener("input", () => {
      el.classList.toggle("changed", el.value !== el.dataset.orig);
      // Only the artist field drives the pre-save move hint: changing the
      // artist will move the file into the new artist's folder on save.
      if (f === "artist") {
        const artistHint = document.getElementById("te-artist-hint");
        if (artistHint) artistHint.hidden = (el.value === el.dataset.orig);
      }
    });
  });
  const fileEl = document.getElementById("te-cover-file");
  const urlEl = document.getElementById("te-cover-url");
  fileEl.addEventListener("change", () => {
    const img = document.getElementById("te-cover-img");
    if (fileEl.files && fileEl.files[0]) {
      fileEl.classList.add("changed");
      img.src = URL.createObjectURL(fileEl.files[0]); img.hidden = false;
    } else {
      fileEl.classList.remove("changed");
    }
  });
  urlEl.addEventListener("input", () => {
    urlEl.classList.toggle("changed", (urlEl.value || "").trim() !== "");
  });
  // Play overlay wiring (set up once). Toggles play/pause on the <audio>
  // element fed by the guarded /api/tageditor/audio endpoint (MP3 only). The
  // src is stored on the button's dataset by prefill() for the current song.
  const playBtn = document.getElementById("te-play");
  const audioEl = document.getElementById("te-audio");
  if (playBtn && audioEl) {
    playBtn.addEventListener("click", () => {
      if (playBtn.disabled) return;
      if (audioEl.paused) {
        const src = playBtn.dataset.src || "";
        if (!src) return;
        if (audioEl.getAttribute("src") !== src) audioEl.src = src;
        audioEl.play().catch(() => {});   // the error listener resets the UI
      } else {
        audioEl.pause();
      }
    });
    audioEl.addEventListener("play", () => { setPlayGlyph(playBtn, "⏸"); });
    audioEl.addEventListener("pause", () => { setPlayGlyph(playBtn, "▶"); });
    audioEl.addEventListener("ended", () => { setPlayGlyph(playBtn, "▶"); });
    // Non-fatal play failure (e.g. the file vanished -> endpoint 404, or
    // 403/401): reset the button and surface a hint, never a stuck spinner.
    audioEl.addEventListener("error", () => {
      if (!audioEl.getAttribute("src")) return;   // ignore the reset .load()
      setPlayGlyph(playBtn, "▶");
      setMsg(t("tageditor.play.error"), true);
    });
  }

  // Set the play/pause glyph into the inner .te-play-glyph span (the C2
  // glassmorphism button keeps the glyph in a span so the ::before sheen does
  // not fight it). Falls back to the button's own textContent if the span is
  // somehow absent.
  function setPlayGlyph(btn, glyph) {
    const g = btn.querySelector(".te-play-glyph");
    if (g) g.textContent = glyph; else btn.textContent = glyph;
  }

  // --- Convert-to-MP3 (Feature A) -------------------------------------------
  // The #te-convert button (shown only for a loaded non-MP3 song, see prefill)
  // opens a confirm dialog with the honest quality-downgrade warning. Only the
  // confirming click POSTs to /api/tageditor/convert.
  const convertBtn = document.getElementById("te-convert");
  const convertDialog = document.getElementById("te-convert-dialog");
  const convertConfirm = document.getElementById("te-convert-confirm");
  const convertCancel = document.getElementById("te-convert-cancel");
  if (convertBtn && convertDialog) {
    convertBtn.addEventListener("click", () => { convertDialog.hidden = false; });
    if (convertCancel) convertCancel.addEventListener("click", () => {
      convertDialog.hidden = true;
    });
    if (convertConfirm) convertConfirm.addEventListener("click", async () => {
      convertDialog.hidden = true;
      const path = document.getElementById("te-path").value;
      setMsg(t("tageditor.convert.working"), false);
      const fd = new FormData();
      fd.append("path", path);
      try {
        const r = await fetch("/api/tageditor/convert",
          {method: "POST", body: fd, cache: "no-store"});
        const d = await r.json();
        if (r.ok && d && d.ok) {
          // Rebind the editor to the now-MP3 song (prefill hides the Convert
          // button, since it is now an MP3) and refresh the non-MP3 list.
          prefill(d.song);
          setMsg(t("tageditor.convert.ok", {trash: d.song.trashed_to || ""}), false);
          loadNonMp3();
          // A convert moves the original into the trash, so refresh the trash
          // list too (it now has one more file).
          loadTrash();
        } else {
          setMsg(esc((d && (d.error || d.message)) || t("tageditor.unreachable")), true);
        }
      } catch (e4) {
        setMsg(t("tageditor.unreachable"), true);
      }
    });
  }

  // --- Delete song (reversible: move to trash + clear manifest) -------------
  // The red #te-delete button (visible only while a song is loaded, since it
  // lives inside the hidden #te-form) opens a confirm dialog. Only the
  // confirming click POSTs to /api/tageditor/delete. On success the form is
  // cleared back to the empty state, the search results are reset, and the
  // trash list is refreshed (it now holds the moved file).
  const deleteBtn = document.getElementById("te-delete");
  const deleteDialog = document.getElementById("te-delete-dialog");
  const deleteWarn = document.getElementById("te-delete-warn");
  const deleteConfirm = document.getElementById("te-delete-confirm");
  const deleteCancel = document.getElementById("te-delete-cancel");
  if (deleteBtn && deleteDialog) {
    deleteBtn.addEventListener("click", () => {
      const rel = deleteBtn.dataset.rel || "";
      // Normal white sentence with the path in a red-bordered .te-pathchip.
      if (deleteWarn) deleteWarn.innerHTML = pathMsgHtml("tageditor.delete.warn", rel, "del");
      deleteDialog.hidden = false;
    });
    if (deleteCancel) deleteCancel.addEventListener("click", () => {
      deleteDialog.hidden = true;
    });
    if (deleteConfirm) deleteConfirm.addEventListener("click", async () => {
      deleteDialog.hidden = true;
      const path = deleteBtn.dataset.path || document.getElementById("te-path").value;
      if (!path) return;
      const fd = new FormData();
      fd.append("path", path);
      try {
        const r = await fetch("/api/tageditor/delete",
          {method: "POST", body: fd, cache: "no-store"});
        const d = await r.json();
        if (r.ok && d && d.ok) {
          // Clear the editor back to the empty state and reset the search so the
          // now-deleted song is no longer offered. The success message goes into
          // the (visible) select-hint line, because #te-msg lives inside the
          // #te-form that resetEditor() hides.
          // Success message: normal white sentence + red-bordered .te-pathchip
          // path, and a smooth audio fade-out if the deleted song was playing.
          resetEditor(pathMsgHtml("tageditor.delete.ok", d.trashed_to || "", "del"),
                      true, true);
          // The file was moved into the trash, so refresh the trash list too.
          loadTrash();
        } else {
          setMsg(esc((d && (d.error || d.message)) || t("tageditor.unreachable")), true);
        }
      } catch (e5) {
        setMsg(t("tageditor.unreachable"), true);
      }
    });
  }

  // Holds the active fade-out interval id so a rapid second stop cancels the
  // first ramp instead of racing it.
  let _fadeTimer = null;

  // Stop in-browser playback and release the <audio> buffer. With {fade:true}
  // AND a song currently playing, the volume is ramped from its current level
  // to 0 over ~500 ms (plain setInterval on HTMLAudioElement.volume, no Web
  // Audio, dependency-free) BEFORE the pause/clear, so a deleted song fades out
  // smoothly instead of cutting off abruptly. The fade is purely the audio
  // tail: the caller's UI work (list refresh, form reset) is NOT delayed - the
  // ramp runs on its own timer. Volume is restored to 1 afterwards for the next
  // song. Without a fade (tab switch / picking another song) it stops at once.
  function stopAudio(opts) {
    const fade = !!(opts && opts.fade);
    const audioEl = document.getElementById("te-audio");
    const playBtn = document.getElementById("te-play");
    const finish = () => {
      if (audioEl) {
        audioEl.pause();
        audioEl.removeAttribute("src");
        audioEl.load();            // release the buffered stream
        audioEl.volume = 1;        // reset for the next song
      }
      if (playBtn) setPlayGlyph(playBtn, "▶");
    };
    if (_fadeTimer) { clearInterval(_fadeTimer); _fadeTimer = null; }
    // Only fade when something is actually audible; otherwise stop immediately.
    if (fade && audioEl && !audioEl.paused && audioEl.volume > 0) {
      const steps = 20;                 // ~25 ms per step -> ~500 ms total
      const start = audioEl.volume;
      const dv = start / steps;
      let i = 0;
      _fadeTimer = setInterval(() => {
        i += 1;
        const v = start - dv * i;
        audioEl.volume = v > 0 ? v : 0;
        if (i >= steps || audioEl.volume <= 0) {
          clearInterval(_fadeTimer); _fadeTimer = null;
          finish();
        }
      }, 25);
    } else {
      finish();
    }
  }

  // Return the editor to the empty "pick a song" state after a delete: hide the
  // form, clear the search input + results, and re-show the select-hint line
  // (which also carries the success message, since #te-msg lives inside the now
  // hidden form). `message` is the status text to show; falls back to the
  // default select hint. Defensive null-checks so it never throws.
  // `message` is the status text (or, when isHtml is true, a pre-built escaped
  // HTML fragment from pathMsgHtml) shown in the select-hint line. `fade` fades
  // out the audio tail (used by delete) instead of an abrupt stop.
  function resetEditor(message, isHtml, fade) {
    // Stop in-browser playback: if the just-deleted (or just-unloaded) song was
    // playing via the cover play button, the <audio> would otherwise keep
    // playing from its buffer after the file was moved to the trash. On delete
    // the stop fades out smoothly (fade:true); other resets stop immediately.
    stopAudio({fade: !!fade});
    form.hidden = true;
    if (input) input.value = "";
    if (results) results.innerHTML = "";
    if (hint) {
      hint.hidden = false;
      // A success message (isHtml) is a transient neutral-styled line that the
      // next navigation/interaction clears; the default hint is the plain gray
      // muted prompt. Tag/untag the neutral class accordingly.
      hint.classList.toggle("te-success-neutral", !!(isHtml && message));
      if (isHtml && message) hint.innerHTML = message;   // escaped chip fragment
      else hint.textContent = message || t("tageditor.select_hint");
    }
  }

  // --- Non-MP3 audio file list (Feature B) ----------------------------------
  // Read-only list below the editor; fetched on load and after each convert.
  // Each row shows the rel_path + a format badge and an "open in tag editor"
  // button that loads that song into the editor above. Fail-open.
  async function loadNonMp3() {
    const listEl = document.getElementById("te-nonmp3-list");
    if (!listEl) return;
    try {
      const r = await fetch("/api/tageditor/nonmp3", {cache: "no-store"});
      const d = await r.json();
      if (!r.ok || !d || !d.ok) {
        listEl.innerHTML = `<div class="s-err">${t("tageditor.nonmp3.error")}</div>`;
        return;
      }
      if (!d.files.length) {
        listEl.innerHTML = `<div class="muted-txt">${t("tageditor.nonmp3.empty")}</div>`;
        return;
      }
      let html = d.files.map(f =>
        `<div class="te-nonmp3-row" data-path="${esc(f.path)}">` +
        `<span class="te-nonmp3-path">${esc(f.rel_path)}</span>` +
        `<span class="badge te-nonmp3-fmt">${esc(f.format)}</span>` +
        `<button type="button" class="btn-sm te-nonmp3-open">${esc(t("tageditor.nonmp3.open"))}</button>` +
        `</div>`).join("");
      if (d.truncated) {
        html += `<div class="muted-txt te-nonmp3-trunc">` +
          `${esc(t("tageditor.nonmp3.truncated", {n: d.files.length}))}</div>`;
      }
      listEl.innerHTML = html;
    } catch (e5) {
      listEl.innerHTML = `<div class="s-err">${t("tageditor.nonmp3.error")}</div>`;
    }
  }
  const nonMp3List = document.getElementById("te-nonmp3-list");
  if (nonMp3List) {
    nonMp3List.addEventListener("click", (e) => {
      const row = e.target.closest(".te-nonmp3-row");
      if (!row) return;
      loadSong(row.getAttribute("data-path"));
      // The editor and the Non-MP3 list now live in separate panes, so switch
      // to the Tag-Editor tab first - otherwise the song would load into a
      // hidden form and scrollIntoView on a display:none element is a no-op.
      activateTab("tageditor");
      // Scroll the editor into view so the loaded song is visible.
      const formEl = document.getElementById("te-form");
      if (formEl) formEl.scrollIntoView({behavior: "smooth", block: "start"});
    });
    loadNonMp3();   // initial fetch on page load
  }

  // --- Trash (Papierkorb) manager -------------------------------------------
  // Read-only listing of the entire .charts-trash tree (per-file + total size),
  // a per-file permanent delete and an empty-whole-trash action. Both delete
  // paths are confirmed by a modal; the server additionally enforces the
  // trash-root scoping and (for empty) an explicit confirm sentinel. Fail-open.
  let _trashPendingPath = null;   // absolute path queued for a per-file delete

  async function loadTrash() {
    const listEl = document.getElementById("te-trash-list");
    const totalEl = document.getElementById("te-trash-total");
    if (!listEl) return;
    try {
      const r = await fetch("/api/tageditor/trash", {cache: "no-store"});
      const d = await r.json();
      if (!r.ok || !d || !d.ok) {
        listEl.innerHTML = `<div class="s-err">${t("tageditor.trash.error")}</div>`;
        if (totalEl) totalEl.textContent = "";
        return;
      }
      if (totalEl) {
        totalEl.textContent = t("tageditor.trash.total",
          {size: d.total_human, count: d.count});
      }
      if (!d.entries.length) {
        listEl.innerHTML = `<div class="muted-txt">${t("tageditor.trash.empty_state")}</div>`;
        return;
      }
      let html = d.entries.map(e => {
        // The GREEN restore button renders ONLY for a backend-flagged restorable
        // row (a Tag-Editor-delete entry with its restore sidecar); every other
        // row keeps only the red delete button.
        const restoreBtn = e.restorable
          ? `<button type="button" class="btn-sm te-trash-restore">${esc(t("tageditor.trash.restore.btn"))}</button>`
          : "";
        return `<div class="te-trash-row" data-path="${esc(e.path)}" data-rel="${esc(e.rel_path)}">` +
          `<span class="te-trash-path te-pathchip">${esc(e.rel_path)}</span>` +
          `<span class="badge te-trash-fmt">${esc(e.format)}</span>` +
          `<span class="te-trash-size">${esc(e.size_human)}</span>` +
          restoreBtn +
          `<button type="button" class="btn-sm te-trash-del">${esc(t("tageditor.trash.delete.btn"))}</button>` +
          `</div>`;
      }).join("");
      if (d.truncated) {
        html += `<div class="muted-txt te-trash-trunc">` +
          `${esc(t("tageditor.trash.truncated", {n: d.entries.length}))}</div>`;
      }
      listEl.innerHTML = html;
    } catch (e6) {
      listEl.innerHTML = `<div class="s-err">${t("tageditor.trash.error")}</div>`;
      if (totalEl) totalEl.textContent = "";
    }
  }

  const trashList = document.getElementById("te-trash-list");
  const trashDelDialog = document.getElementById("te-trash-delete-dialog");
  const trashDelWarn = document.getElementById("te-trash-delete-warn");
  const trashDelConfirm = document.getElementById("te-trash-delete-confirm");
  const trashDelCancel = document.getElementById("te-trash-delete-cancel");

  if (trashList && trashDelDialog) {
    // A click on a row's Delete button opens the per-file confirm modal showing
    // the file's rel_path; only the confirming click POSTs the absolute path.
    trashList.addEventListener("click", (e) => {
      const btn = e.target.closest(".te-trash-del");
      if (!btn) return;
      const row = e.target.closest(".te-trash-row");
      if (!row) return;
      _trashPendingPath = row.getAttribute("data-path");
      const rel = row.getAttribute("data-rel") || "";
      if (trashDelWarn) {
        trashDelWarn.textContent = t("tageditor.trash.delete.warn", {path: rel});
      }
      trashDelDialog.hidden = false;
    });
    if (trashDelCancel) trashDelCancel.addEventListener("click", () => {
      trashDelDialog.hidden = true;
      _trashPendingPath = null;
    });
    if (trashDelConfirm) trashDelConfirm.addEventListener("click", async () => {
      trashDelDialog.hidden = true;
      const path = _trashPendingPath;
      _trashPendingPath = null;
      if (!path) return;
      const fd = new FormData();
      fd.append("path", path);
      try {
        const r = await fetch("/api/tageditor/trash/delete",
          {method: "POST", body: fd, cache: "no-store"});
        const d = await r.json();
        if (r.ok && d && d.ok) {
          setMsg(t("tageditor.trash.delete.ok", {path: d.deleted || ""}), false);
        } else {
          setMsg(esc((d && (d.error || d.message)) || t("tageditor.unreachable")), true);
        }
      } catch (e7) {
        setMsg(t("tageditor.unreachable"), true);
      }
      loadTrash();   // refresh list + total regardless of outcome
    });
  }

  // --- Restore (green) --------------------------------------------------------
  // Non-destructive: move a Tag-Editor-deleted song back to its original
  // location. A light confirm (restore is reversible) mirrors the delete modal;
  // only the confirming click POSTs the absolute path to /trash/restore.
  let _trashRestorePath = null;
  const trashRestoreDialog = document.getElementById("te-trash-restore-dialog");
  const trashRestoreWarn = document.getElementById("te-trash-restore-warn");
  const trashRestoreConfirm = document.getElementById("te-trash-restore-confirm");
  const trashRestoreCancel = document.getElementById("te-trash-restore-cancel");
  if (trashList && trashRestoreDialog) {
    trashList.addEventListener("click", (e) => {
      const btn = e.target.closest(".te-trash-restore");
      if (!btn) return;
      const row = e.target.closest(".te-trash-row");
      if (!row) return;
      _trashRestorePath = row.getAttribute("data-path");
      const rel = row.getAttribute("data-rel") || "";
      if (trashRestoreWarn) {
        // Normal white sentence with the path in a green-bordered .te-pathchip.
        trashRestoreWarn.innerHTML = pathMsgHtml("tageditor.trash.restore.warn", rel, "restore");
      }
      trashRestoreDialog.hidden = false;
    });
    if (trashRestoreCancel) trashRestoreCancel.addEventListener("click", () => {
      trashRestoreDialog.hidden = true;
      _trashRestorePath = null;
    });
    if (trashRestoreConfirm) trashRestoreConfirm.addEventListener("click", async () => {
      trashRestoreDialog.hidden = true;
      const path = _trashRestorePath;
      _trashRestorePath = null;
      if (!path) return;
      const fd = new FormData();
      fd.append("path", path);
      try {
        const r = await fetch("/api/tageditor/trash/restore",
          {method: "POST", body: fd, cache: "no-store"});
        const d = await r.json();
        if (r.ok && d && d.ok) {
          // Success message: normal white sentence + green-bordered .te-pathchip.
          setSuccessPathMsg("tageditor.trash.restore.ok", d.restored || "", "restore");
        } else {
          setMsg(esc((d && (d.error || d.message)) || t("tageditor.unreachable")), true);
        }
      } catch (e9) {
        setMsg(t("tageditor.unreachable"), true);
      }
      loadTrash();   // refresh list + total regardless of outcome
    });
  }

  const trashRefresh = document.getElementById("te-trash-refresh");
  if (trashRefresh) trashRefresh.addEventListener("click", () => loadTrash());

  const trashEmptyBtn = document.getElementById("te-trash-empty");
  const trashEmptyDialog = document.getElementById("te-trash-empty-dialog");
  const trashEmptyConfirm = document.getElementById("te-trash-empty-confirm");
  const trashEmptyCancel = document.getElementById("te-trash-empty-cancel");
  if (trashEmptyBtn && trashEmptyDialog) {
    trashEmptyBtn.addEventListener("click", () => { trashEmptyDialog.hidden = false; });
    if (trashEmptyCancel) trashEmptyCancel.addEventListener("click", () => {
      trashEmptyDialog.hidden = true;
    });
    if (trashEmptyConfirm) trashEmptyConfirm.addEventListener("click", async () => {
      trashEmptyDialog.hidden = true;
      const fd = new FormData();
      // The server requires this exact sentinel; a stray submit cannot empty.
      fd.append("confirm", "empty");
      try {
        const r = await fetch("/api/tageditor/trash/empty",
          {method: "POST", body: fd, cache: "no-store"});
        const d = await r.json();
        if (r.ok && d && d.ok) {
          if (d.failed) {
            setMsg(t("tageditor.trash.empty.partial",
              {removed: d.removed, failed: d.failed}), false);
          } else {
            setMsg(t("tageditor.trash.empty.ok", {removed: d.removed}), false);
          }
        } else {
          setMsg(esc((d && (d.error || d.message)) || t("tageditor.unreachable")), true);
        }
      } catch (e8) {
        setMsg(t("tageditor.unreachable"), true);
      }
      loadTrash();
    });
  }

  if (trashList) loadTrash();   // initial fetch on page load

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData();
    fd.append("path", document.getElementById("te-path").value);
    TE_FIELDS.forEach(f => fd.append(f, document.getElementById("te-" + f).value));
    const url = (urlEl.value || "").trim();
    if (url) fd.append("cover_url", url);
    if (fileEl.files && fileEl.files[0]) fd.append("cover_file", fileEl.files[0]);
    setMsg(t("tageditor.searching"), false);
    try {
      const r = await fetch("/api/tageditor/save", {method: "POST", body: fd, cache: "no-store"});
      const d = await r.json();
      if (r.ok && d && d.ok) {
        // prefill repoints #te-path to d.song.path (the NEW path after a move)
        // and re-reads every field, so the editor is selected on the moved
        // file; a subsequent save/search targets the new path.
        prefill(d.song);
        // Rules 4/5: the tags are saved in place but the move needs a user
        // choice -> open the decision dialog (no terminal message yet).
        if (d.song.decision) {
          openMoveDialog(d.song.decision);
        } else {
          reportMoveResult(d.song);
        }
      } else {
        setMsg(esc((d && (d.error || d.message)) || t("tageditor.unreachable")), true);
      }
    } catch (e2) {
      setMsg(t("tageditor.unreachable"), true);
    }
  });

  // Honest terminal result message for an auto (rules 1,2,3,6) or post-dialog
  // save, based on the moved flag + move_reason the engine returned.
  function reportMoveResult(song) {
    if (song.moved) {
      setMsg(t("tageditor.moved", {artist: song.moved_to_artist}), false);
    } else if (song.move_reason === "target_exists") {
      setMsg(t("tageditor.move_blocked_exists"), false);
    } else if (song.move_reason === "cross_device"
               || song.move_reason === "move_failed") {
      setMsg(t("tageditor.move_failed"), false);
    } else if (song.move_reason === "kept_in_place") {
      setMsg(t("tageditor.move_kept_in_place"), false);
    } else {
      // unchanged / album_managed / no artist change -> plain success.
      setMsg(t("tageditor.saved"), false);
    }
  }

  // Build + show the move decision dialog for a decision payload. `loose`
  // offers [into existing] [create new] [cancel]; `collision` offers
  // [keep existing / cancel]. Each button wires its choice to submitMoveChoice.
  function openMoveDialog(dec) {
    const dialog = document.getElementById("te-move-dialog");
    const q = document.getElementById("te-move-question");
    const btns = document.getElementById("te-move-buttons");
    btns.innerHTML = "";
    const addBtn = (label, choice, primary) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "te-modal-btn" + (primary ? " primary" : "");
      b.textContent = label;
      b.addEventListener("click", () => submitMoveChoice(dec, choice));
      btns.appendChild(b);
    };
    if (dec.variant === "loose") {
      q.textContent = t("tageditor.move_dialog.loose_question",
        {existing: dec.existing_folder, count: dec.other_count,
         newname: dec.new_folder});
      addBtn(t("tageditor.move_dialog.into_existing",
        {existing: dec.existing_folder}), "into_existing", true);
      addBtn(t("tageditor.move_dialog.create_new",
        {newname: dec.new_folder}), "create_new", false);
      addBtn(t("tageditor.move_dialog.cancel"), "cancel", false);
    } else {  // collision
      q.textContent = t("tageditor.move_dialog.collision_question",
        {existing: dec.existing_folder});
      addBtn(t("tageditor.move_dialog.keep_existing"), "cancel", true);
      addBtn(t("tageditor.move_dialog.cancel"), "cancel", false);
    }
    dialog.hidden = false;
  }

  // POST the chosen action to /api/tageditor/move, then reload the editor on
  // the returned (possibly new) path and show the honest terminal message.
  async function submitMoveChoice(dec, choice) {
    document.getElementById("te-move-dialog").hidden = true;
    const fd = new FormData();
    fd.append("path", dec.file);
    fd.append("choice", choice);
    fd.append("artist", dec.artist);
    fd.append("title", dec.title);
    fd.append("album", dec.album);
    setMsg(t("tageditor.searching"), false);
    try {
      const r = await fetch("/api/tageditor/move",
        {method: "POST", body: fd, cache: "no-store"});
      const d = await r.json();
      if (r.ok && d && d.ok) {
        prefill(d.song);
        if (choice === "cancel") {
          setMsg(t("tageditor.move_kept_in_place"), false);
        } else {
          reportMoveResult(d.song);
        }
      } else {
        setMsg(esc((d && (d.error || d.message)) || t("tageditor.unreachable")), true);
      }
    } catch (e3) {
      setMsg(t("tageditor.unreachable"), true);
    }
  }
}

// --- Tab switcher (config) --------------------------------------------------
// Pure layout: toggles which .tabpane is visible and updates the per-tab header
// title/description. No section markup, element ID, form, or request handler is
// touched. Mirrors charts-songrequest's switcher; adds the header swap and a
// shared activateTab() used by both the tab bar and the Non-MP3 cross-pane jump
// (so the two navigation paths cannot drift). Declared as a function so it is
// hoisted and reachable from the Non-MP3 handler inside initTagEditor().
const PANE_HEAD = {
  finder:    { title: "section.finder",            desc: "finder.hint",            html: true  },
  energy:    { title: "section.energy",            desc: "energy.hint",            html: true  },
  tageditor: { title: "section.tageditor",         desc: "tageditor.hint",         html: false },
  nonmp3:    { title: "tageditor.nonmp3.heading",  desc: "tageditor.nonmp3.hint",  html: false },
  trash:     { title: "section.trash",             desc: "tageditor.trash.hint",   html: false },
};
function setPaneHead(tab) {
  const h = PANE_HEAD[tab];
  if (!h) return;
  const titleEl = document.getElementById("pane-title");
  const descEl = document.getElementById("pane-desc");
  if (titleEl) titleEl.textContent = t(h.title);   // all titles are plain text
  if (descEl) {
    if (h.html) descEl.innerHTML = t(h.desc);       // finder/energy carry <b>/<code>
    else descEl.textContent = t(h.desc);            // plain-text descriptions
  }
}
const configTabs = document.querySelectorAll(".tabs .tab");
// Single source of truth for "make tab <target> active": toggles the active
// button, shows the matching pane and hides the rest, and swaps the header.
// Reused by the tab-bar click handler AND the Non-MP3 "open in tag editor"
// button so the two paths cannot diverge.
function activateTab(target) {
  // A lingering delete/restore success message is transient: clear it on any
  // tab switch (the user navigated away from the action's context).
  clearTagEditorSuccessMsg();
  configTabs.forEach(b => b.classList.toggle("active", b.dataset.tab === target));
  document.querySelectorAll("[data-pane]").forEach(p => {
    p.hidden = p.dataset.pane !== target;
  });
  setPaneHead(target);
}

// Clear a transient delete/restore SUCCESS message (fixes the message
// "lingering" after the action). Called on tab-switch and on a fresh Tag-Editor
// interaction (new search / picking a song). Only clears the neutral success
// line, identified by the .te-success-neutral class, so it never wipes an error
// message or the plain select-hint. #te-hint falls back to its default prompt;
// #te-msg is emptied. Module-scope + getElementById so both activateTab and the
// in-editor handlers can call it. Defensive: never throws if an element is
// absent. NOTE: not called on render - the message is shown after the action
// and only cleared on the NEXT navigation/interaction.
function clearTagEditorSuccessMsg() {
  const hint = document.getElementById("te-hint");
  if (hint && hint.classList.contains("te-success-neutral")) {
    hint.classList.remove("te-success-neutral");
    hint.textContent = t("tageditor.select_hint");
  }
  const msg = document.getElementById("te-msg");
  if (msg && msg.classList.contains("te-success-neutral")) {
    msg.classList.remove("te-success-neutral");
    msg.innerHTML = "";
    msg.className = "te-msg";
  }
}

applyStaticI18n();   // populate the static head/body markup once on load
configTabs.forEach(tab => {
  tab.addEventListener("click", () => activateTab(tab.dataset.tab));
});
setPaneHead("finder");   // fill the header for the default (finder) tab on load
initTagEditor();     // wire the manual tag editor (independent of the finder)
// charts-config has no /api/status; probe the Last.fm endpoint once (empty
// query) to learn whether a key is configured, then init the finder. The
// backend returns `configured` even without an API key.
fetch("/api/sources/lastfm/tag?q=", {cache: "no-store"})
  .then(r => r.json())
  .then(d => initFinder({configured: d && d.configured}))
  .catch(() => initFinder({}));
</script>
</body>
