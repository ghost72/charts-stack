<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">charts-config</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=config21">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-badge">🧩</span>
    <span class="brand-text">
      <span class="brand-title">charts-config</span>
      <span class="brand-sub" data-i18n="brand.subtitle">Charts-Automatik · Snippet-Tool</span>
    </span>
  </div>
  <div class="meta">
    <a class="logout" href="/logout" data-i18n="logout">⎋ Abmelden</a>
  </div>
</header>

<main>
  <!-- Login-style hero: the 🧩 logo mark (same glyph as the login heading) +
       the page title in white. Mirrors charts-songrequest's .logo + h1. -->
  <div class="config-hero">
    <div class="config-logo" aria-hidden="true">🧩</div>
    <h1 class="config-hero-title" data-i18n="config_tabs.app_title">charts-config</h1>
  </div>

  <!-- Tab bar: one button per section, Quellen-Finder active on load. Mirrors
       charts-songrequest's .tabs > button.tab[data-tab]. The emoji on each tab
       is byte-identical to the mirrored section-title glyph (incl. the VS16 on
       the tag-editor and non-MP3 labels) so a tab and its #pane-title never
       render different presentations of the same symbol. -->
  <div class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="finder"
            data-i18n="config_tabs.tab.finder">🔎 Quellen-Finder</button>
    <button type="button" class="tab" data-tab="energy"
            data-i18n="config_tabs.tab.energy">⚡ Energy-Kanäle</button>
    <button type="button" class="tab" data-tab="tageditor"
            data-i18n="config_tabs.tab.tageditor">🏷️ Tag-Editor</button>
    <button type="button" class="tab" data-tab="nonmp3"
            data-i18n="config_tabs.tab.nonmp3">🎚️ Nicht-MP3</button>
    <button type="button" class="tab" data-tab="trash"
            data-i18n="config_tabs.tab.trash">🗑 Papierkorb</button>
  </div>

  <!-- Per-tab heading block: the title (reuses each section's existing
       section.*/heading key) + the description (reuses each section's existing
       *.hint key). Both are filled by the tab switcher; initial values target
       the first (finder) tab. #pane-desc is written via innerHTML for the
       finder/energy descriptions (they carry inert <b>/<code> markup) and via
       textContent for the plain-text ones. -->
  <div class="pane-head">
    <h2 class="pane-title" id="pane-title"></h2>
    <div class="pane-desc finder-hint" id="pane-desc"></div>
  </div>

  <!-- Pane 1: Quellen-Finder (visible on load). The section-specific second
       hint line (finder.run_hint) stays in the pane; only the primary
       finder.hint is lifted into #pane-desc. -->
  <div class="tabpane" data-pane="finder">
    <div class="finder-hint" data-i18n="finder.run_hint"></div>
    <div class="finder">
      <!-- Deezer playlist search -->
      <div class="finder-box">
        <h3 data-i18n="finder.box.deezer_playlist">Deezer-Playlist suchen</h3>
        <form id="dz-pl-form">
          <input id="dz-pl-q" data-i18n-ph="finder.ph.deezer_playlist" placeholder="z.B. pop, country, schweiz">
          <button type="submit" data-i18n="finder.btn.search">Suchen</button>
        </form>
        <div id="dz-pl-results"></div>
      </div>
      <!-- Deezer artist search (for type:artist) -->
      <div class="finder-box">
        <h3 data-i18n="finder.box.deezer_artist">Deezer-Künstler suchen</h3>
        <form id="dz-ar-form">
          <input id="dz-ar-q" data-i18n-ph="finder.ph.deezer_artist" placeholder="z.B. Gölä, Polo Hofer, Bligg">
          <button type="submit" data-i18n="finder.btn.search">Suchen</button>
        </form>
        <div id="dz-ar-results"></div>
      </div>
      <!-- Last.fm tag search (only when a key is set, otherwise grayed out) -->
      <div class="finder-box" id="lf-tag-box">
        <h3 data-i18n="finder.box.lastfm_tag">Last.fm-Tag prüfen</h3>
        <div id="lf-chips" class="chips"></div>
        <form id="lf-tag-form">
          <input id="lf-tag-q" data-i18n-ph="finder.ph.lastfm_tag" placeholder="z.B. pop, 80s, country">
          <button type="submit" data-i18n="finder.btn.check">Prüfen</button>
        </form>
        <div id="lf-tag-results"></div>
      </div>
      <!-- Deezer genre table (live, daily; fallback static) -->
      <div class="finder-box">
        <h3 data-i18n="finder.box.deezer_genres">Deezer-Genres</h3>
        <table id="dz-genres">
          <thead><tr><th data-i18n="finder.col.id">ID</th><th data-i18n="finder.col.genre">Genre</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Pane 2: Energy-Kanäle (hidden until selected). Read-only panel that
       mirrors the source finder; it never writes .env/charts.json. The extra
       energy.note.* lines + energy.run_hint stay in the pane; only energy.hint
       is lifted into #pane-desc. -->
  <div class="tabpane" data-pane="energy" hidden>
    <div class="finder-hint" data-i18n-html="energy.note.own"></div>
    <div class="finder-hint" data-i18n-html="energy.note.feed"></div>
    <div class="finder-hint" data-i18n-html="energy.note.library"></div>
    <div class="finder-hint" data-i18n="energy.run_hint"></div>
    <!-- Not the 2-col .finder grid: the Energy browser is a wide 6-col table,
         so it gets its own single full-width box. -->
    <div class="finder finder-full">
      <div class="finder-box">
        <div id="energy-channels"><div class="muted-txt" data-i18n="energy.loading"></div></div>
      </div>
    </div>
  </div>

  <!-- Pane 3: Manueller Tag-Editor (hidden). Search the library, pick a song,
       edit its tags/cover in place. The only read-write section (saving clears
       the stack markers). Inert without the /music/Music mount (search returns
       nothing). tageditor.hint is lifted into #pane-desc. -->
  <div class="tabpane" data-pane="tageditor" hidden>
    <div class="finder finder-full">
      <div class="finder-box">
        <input id="te-search" autocomplete="off" data-i18n-ph="tageditor.ph.search"
               placeholder="Search artist or title…">
        <div id="te-results" class="te-results"></div>
        <div id="te-hint" class="muted-txt" data-i18n="tageditor.select_hint"></div>

        <form id="te-form" class="te-form" hidden>
          <input type="hidden" id="te-path">
          <div id="te-mp3only" class="s-err" data-i18n="tageditor.mp3_only" hidden></div>
          <!-- Top row: editable fields on the LEFT, cover preview on the RIGHT,
               side by side. The upload controls and legend drop to their own
               full-width rows BELOW this row. -->
          <div class="te-top">
            <div class="te-grid">
              <label data-i18n="tageditor.label.artist">Artist</label>
              <input id="te-artist" autocomplete="off">
              <div id="te-artist-hint" class="te-hint te-hint-warn" data-i18n="tageditor.move_hint" hidden></div>
              <label data-i18n="tageditor.label.title">Title</label>
              <input id="te-title" autocomplete="off">
              <label data-i18n="tageditor.label.album">Album</label>
              <input id="te-album" autocomplete="off">
              <label data-i18n="tageditor.label.year">Year</label>
              <input id="te-year" autocomplete="off" inputmode="numeric">
              <label data-i18n="tageditor.label.track">Track</label>
              <input id="te-track" autocomplete="off" inputmode="numeric">
              <!-- Read-only file path + bitrate/format row (always on). Spans
                   both grid columns; filled by prefill(). Helps spot leftover
                   non-MP3 (FLAC) files. Never submitted. -->
              <div class="te-fileinfo" id="te-fileinfo">
                <span class="te-fileinfo-label" data-i18n="tageditor.label.fileinfo">File</span>
                <span class="te-fileinfo-val" id="te-fileinfo-val"></span>
                <!-- Convert-to-MP3 trigger: placed INLINE on the file-info row,
                     immediately after the "Datei … · FLAC (verlustfrei)" text,
                     so it reads "this file is FLAC -> convert it". NOT inside
                     .te-cover (whose play/download children are revealed only
                     when the TAGEDITOR_AUDIO_ENABLED flag is on). Its visibility
                     is driven SOLELY by song.is_mp3 === false (song.ext fallback),
                     independent of song.audio_enabled, so convert is reachable
                     with the audio flag OFF (default) - the convert route is
                     auth-gated, not flag-gated. -->
                <button type="button" id="te-convert" class="te-convert" hidden
                        data-i18n="tageditor.convert.btn">Convert to MP3</button>
                <!-- Red "delete this song" button at the RIGHT end of the
                     file-info row (the flex:1 value column absorbs the free space
                     before it). It lives inside #te-form, so it only appears once
                     a song is loaded (the form is hidden until then). It reuses the Trash-Manager's red .te-trash-empty-btn
                     treatment (no new ad-hoc red); the red is re-asserted under
                     #te-form so it beats the generic blue `.finder-box form button`
                     rule on specificity. type=button so it never submits the Save
                     form; its confirm dialog + route are unchanged. -->
                <button type="button" id="te-delete" class="te-trash-empty-btn te-delete-btn"
                        data-i18n="tageditor.delete.btn">Delete song</button>
              </div>
            </div>
            <div class="te-cover">
              <!-- C1: the label + box are grouped in .te-cover-top so that
                   .te-cover (justify-content:space-between) pins this group to
                   the TOP and drops #te-download to the column BOTTOM, flush
                   with the left .te-fileinfo line. The box keeps its top
                   alignment with the first input. -->
              <div class="te-cover-top">
                <!-- Head row ABOVE the cover box: the "Cover" label on the LEFT
                     and a discreet grey rounded-pill Cover-Download control on
                     the RIGHT. The download link fetches the FULL embedded cover
                     in original resolution via GET /api/tageditor/cover
                     (independent of the 8 MiB preview cap). prefill() shows it
                     ONLY when the song HAS an embedded cover (present === true,
                     including the oversize case) and hides it otherwise. -->
                <div class="te-cover-head">
                  <span class="te-cover-label" data-i18n="tageditor.label.cover">Cover</span>
                  <a id="te-cover-dl" class="te-cover-dl" hidden download
                     data-i18n="tageditor.cover.download"
                     data-i18n-title="tageditor.cover.download_title">Download</a>
                </div>
                <!-- Rounded placeholder box: stays as a tidy empty card when no
                     cover is loaded; the music-note placeholder SVG (same logo as
                     charts-songrequest, copied per-service into this app's static)
                     is centered while the box is empty and hidden once a real cover
                     img is loaded. The img (overflow-clipped by the box) inherits
                     the rounded corners when present. -->
                <div class="te-cover-box">
                  <img class="te-cover-placeholder" src="/static/cover-placeholder.svg" alt="" aria-hidden="true">
                  <img id="te-cover-img" class="te-cover-img" alt="" hidden>
                  <!-- Play overlay on the cover (only rendered when the
                       TAGEDITOR_AUDIO_ENABLED server flag is on AND a song is
                       loaded). Enabled for MP3, disabled with an "MP3 only" hint
                       for FLAC/lossless. Hidden by default; prefill() reveals it.
                       The play triangle lives in an inner span so the C2 sheen
                       gradient does not fight the glyph. -->
                  <button type="button" id="te-play" class="te-play-overlay" hidden
                          data-i18n-title="tageditor.play.title" aria-label="Play"><span class="te-play-glyph">▶</span></button>
                  <audio id="te-audio" preload="none"></audio>
                </div>
              </div>
              <!-- Download button under the cover: works for ALL formats
                   (incl. FLAC), unlike play. Flag-gated like the play overlay. -->
              <a id="te-download" class="te-download" hidden download
                 data-i18n="tageditor.download.btn">Download</a>
            </div>
          </div>
          <!-- Upload controls on one responsive row BELOW the top row; the file
               chooser and image-URL field share the width and the primary Save
               button sits at the right end of the row. -->
          <div class="te-cover-controls">
            <label class="te-file" data-i18n="tageditor.cover.upload">Upload image</label>
            <input id="te-cover-file" class="te-file-input" type="file" accept="image/jpeg,image/png">
            <input id="te-cover-url" autocomplete="off" data-i18n-ph="tageditor.cover.url"
                   placeholder="…or image URL">
            <button type="submit" class="te-save" data-i18n="tageditor.btn.save">Save</button>
          </div>
          <!-- Save-status line (the Convert button and the red delete button both
               moved up onto the file-info row). Kept as its own always-on row so a
               short status never shifts the layout above it. -->
          <div class="te-actions">
            <span id="te-msg" class="te-msg"></span>
          </div>
          <!-- Label legend: explains the two result badges shown on the right
               of each search row. Reuses the exact badge markup/classes
               (.badge .badge-stack / .badge-curated) and their existing i18n
               labels (tageditor.origin.*) so the legend badges look identical
               to the list badges. Compact, muted, wraps on narrow screens. -->
          <div class="te-legend muted-txt">
            <span class="te-legend-item">
              <span class="badge badge-stack" data-i18n="tageditor.origin.stack">stack</span>
              <span data-i18n="tageditor.legend.stack"></span>
            </span>
            <span class="te-legend-item">
              <span class="badge badge-curated" data-i18n="tageditor.origin.curated">curated</span>
              <span data-i18n="tageditor.legend.curated"></span>
            </span>
            <span class="te-legend-note" data-i18n="tageditor.legend.note"></span>
          </div>
        </form>

        <!-- Move decision dialog (rules 4 + 5). Hidden until a save returns a
             decision_needed payload. The question text + buttons are filled in
             by openMoveDialog() per variant (loose vs collision); the chosen
             action POSTs to /api/tageditor/move and reloads the moved file. -->
        <div id="te-move-dialog" class="te-modal" hidden>
          <div class="te-modal-card" role="dialog" aria-modal="true"
               aria-labelledby="te-move-title">
            <h3 id="te-move-title" data-i18n="tageditor.move_dialog.title"></h3>
            <p id="te-move-question" class="te-modal-q"></p>
            <div id="te-move-buttons" class="te-modal-buttons"></div>
          </div>
        </div>

        <!-- Convert-to-MP3 confirm dialog (Feature A). Mirrors the move dialog
             markup/classes. Opened by the #te-convert button; the honest
             quality-downgrade warning is shown and only the confirming click
             POSTs to /api/tageditor/convert. -->
        <div id="te-convert-dialog" class="te-modal" hidden>
          <div class="te-modal-card" role="dialog" aria-modal="true"
               aria-labelledby="te-convert-title">
            <h3 id="te-convert-title" data-i18n="tageditor.convert.title"></h3>
            <p class="te-modal-q" data-i18n="tageditor.convert.warn"></p>
            <div class="te-modal-buttons">
              <button type="button" id="te-convert-confirm" class="te-modal-btn primary"
                      data-i18n="tageditor.convert.confirm"></button>
              <button type="button" id="te-convert-cancel" class="te-modal-btn"
                      data-i18n="tageditor.convert.cancel"></button>
            </div>
          </div>
        </div>

        <!-- Delete-song confirm dialog. Mirrors the Trash-Manager per-file
             delete modal (same .te-modal markup, .te-danger-text warning,
             .te-modal-btn.danger red confirm). Opened by the #te-delete button;
             only the confirming click POSTs to /api/tageditor/delete. The warn
             line is filled per song (rel_path) and makes clear the file is moved
             to the trash (reversible), not hard-deleted. -->
        <div id="te-delete-dialog" class="te-modal" hidden>
          <div class="te-modal-card" role="dialog" aria-modal="true"
               aria-labelledby="te-delete-title">
            <h3 id="te-delete-title" data-i18n="tageditor.delete.title"></h3>
            <p id="te-delete-warn" class="te-modal-q"></p>
            <div class="te-modal-buttons">
              <button type="button" id="te-delete-confirm" class="te-modal-btn danger"
                      data-i18n="tageditor.delete.confirm"></button>
              <button type="button" id="te-delete-cancel" class="te-modal-btn"
                      data-i18n="tageditor.delete.cancel"></button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Pane 4: Nicht-MP3-Audiodateien (hidden). Read-only; lists only non-MP3
       AUDIO files in the library (fetched from /api/tageditor/nonmp3). Each row
       offers "open in tag editor", which switches to the Tag-Editor tab.
       tageditor.nonmp3.hint is lifted into #pane-desc. -->
  <div class="tabpane" data-pane="nonmp3" hidden>
    <div class="finder finder-full">
      <div class="finder-box">
        <div class="te-nonmp3" id="te-nonmp3">
          <div id="te-nonmp3-list" class="te-nonmp3-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pane 5: Papierkorb (hidden). Read-only listing of the entire
       MUSIC_DIR/.charts-trash tree (per-file + total size), with a per-file
       permanent delete and an empty-whole-trash action. The delete/empty are
       the MOST destructive operations in the stack (hard delete of files
       already at the last reversible stage), so the server confines them
       strictly to .charts-trash and requires an explicit confirm to empty.
       Fetched from /api/tageditor/trash. tageditor.trash.hint -> #pane-desc. -->
  <div class="tabpane" data-pane="trash" hidden>
    <div class="finder finder-full">
      <div class="finder-box">
        <div class="te-trash" id="te-trash">
          <div class="te-trash-bar">
            <span class="te-trash-total" id="te-trash-total"></span>
            <button type="button" id="te-trash-refresh" class="btn-sm"
                    data-i18n="tageditor.trash.refresh"></button>
            <button type="button" id="te-trash-empty" class="te-trash-empty-btn"
                    data-i18n="tageditor.trash.empty.btn"></button>
          </div>
          <div id="te-trash-list" class="te-trash-list"></div>
        </div>

        <!-- Per-file delete confirm (reuses the .te-modal markup). The file's
             rel_path + an honest "permanent, cannot be undone" warning; only the
             confirming click POSTs to /api/tageditor/trash/delete. -->
        <div id="te-trash-delete-dialog" class="te-modal" hidden>
          <div class="te-modal-card" role="dialog" aria-modal="true"
               aria-labelledby="te-trash-delete-title">
            <h3 id="te-trash-delete-title" data-i18n="tageditor.trash.delete.title"></h3>
            <p id="te-trash-delete-warn" class="te-modal-q te-danger-text"></p>
            <div class="te-modal-buttons">
              <button type="button" id="te-trash-delete-confirm" class="te-modal-btn danger"
                      data-i18n="tageditor.trash.delete.confirm"></button>
              <button type="button" id="te-trash-delete-cancel" class="te-modal-btn"
                      data-i18n="tageditor.trash.delete.cancel"></button>
            </div>
          </div>
        </div>

        <!-- Restore confirm (green action): a LIGHT confirm (restore is
             reversible/non-destructive). Shows the file's rel_path; only the
             confirming click POSTs to /api/tageditor/trash/restore. -->
        <div id="te-trash-restore-dialog" class="te-modal" hidden>
          <div class="te-modal-card" role="dialog" aria-modal="true"
               aria-labelledby="te-trash-restore-title">
            <h3 id="te-trash-restore-title" data-i18n="tageditor.trash.restore.title"></h3>
            <p id="te-trash-restore-warn" class="te-modal-q"></p>
            <div class="te-modal-buttons">
              <button type="button" id="te-trash-restore-confirm" class="te-modal-btn te-restore-ok"
                      data-i18n="tageditor.trash.restore.confirm"></button>
              <button type="button" id="te-trash-restore-cancel" class="te-modal-btn"
                      data-i18n="tageditor.trash.restore.cancel"></button>
            </div>
          </div>
        </div>

        <!-- Empty-whole-trash confirm: a PROMINENT dialog whose wording makes
             the finality unmistakable (the trash IS the last reversible stage).
             The confirming click POSTs confirm=empty to the empty route. -->
        <div id="te-trash-empty-dialog" class="te-modal" hidden>
          <div class="te-modal-card" role="dialog" aria-modal="true"
               aria-labelledby="te-trash-empty-title">
            <h3 id="te-trash-empty-title" data-i18n="tageditor.trash.empty.title"></h3>
            <p class="te-modal-q te-danger-text" data-i18n="tageditor.trash.empty.warn"></p>
            <div class="te-modal-buttons">
              <button type="button" id="te-trash-empty-confirm" class="te-modal-btn danger"
                      data-i18n="tageditor.trash.empty.confirm"></button>
              <button type="button" id="te-trash-empty-cancel" class="te-modal-btn"
                      data-i18n="tageditor.trash.empty.cancel"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// Injected i18n subset (config.ui.* re-based) + client translator. Mirrors the
// Python loader's {name} substitution (split/join, not regex) and its
// missing-key -> key-name fallback. English fallback is already merged in by
// the server before injection.
const I18N = {{I18N}};
function t(key, params) {
  let s = I18N[key];
  if (s === undefined) return key;
  if (params) for (const k in params)
    s = s.split("{" + k + "}").join(String(params[k]));
  return s;
}
// One-shot static-markup sweep: textContent for [data-i18n], placeholder for
// [data-i18n-ph], innerHTML for [data-i18n-html] (nodes carrying inert markup
// like the finder hint's <code>). Runs once at the end of this script.
function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  // title sweep: initial tooltip for [data-i18n-title] nodes (e.g. the play
  // overlay). prefill() later re-sets the play tooltip per song (MP3 vs FLAC).
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    el.title = t(el.dataset.i18nTitle);
  });
}

// Static fallback genre table (snapshot of stable Deezer genre IDs), used when
// the live call /api/sources/deezer/genres fails (fail-open).
const STATIC_GENRES = [
  ["0","All"],["132","Pop"],["116","Rap/Hip Hop"],["152","Rock"],
  ["113","Dance"],["165","R&B"],["85","Alternative"],["106","Electro"],
  ["466","Folk"],["153","Blues"],["98","Classical"],["84","Country"],
  ["129","Jazz"],["173","Films/Games"],["464","Metal"],["169","Soul & Funk"],
  ["2","African Music"],["12","Brazilian Music"],["16","Indian Music"],
];
// Static suggested tags (common, reliably well-populated Last.fm tags).
const STATIC_TAGS = ["pop","rock","hip-hop","electronic","dance","country",
  "metal","jazz","80s","90s","2000s","indie","r&b","soul","folk","classical",
  "swiss"];

let _finderDone = false;

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Copies a snippet string to the clipboard. navigator.clipboard only exists in
// a secure context (HTTPS) - otherwise a fallback via a temporary readonly
// field + execCommand.
function copySnippet(text, btn) {
  const done = () => {
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = t("finder.copied");
    setTimeout(() => { btn.textContent = old; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.position = "absolute"; ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
  if (done) done();
}

// Builds a snippet cell: readonly <code> (the compact single line, selectable)
// plus two copy buttons. "Line" copies the exact compact snippet (for the
// ENERGY_CHANNELS= / CHARTS= line in .env); "Block" copies the SAME JSON object
// pretty-printed (multi-line, 2-space indent) for the energy-channels.json /
// charts.json file. The block is produced only on copy (never rendered in the
// cell). Parse-guard: if the snippet is not valid JSON, offer only the Line
// button so the cell never breaks.
function snippetCell(snippet) {
  let block = null;
  try { block = JSON.stringify(JSON.parse(snippet), null, 2); } catch (e) { block = null; }
  const lineBtn =
    `<button type="button" class="btn-sm snip-copy" data-snip-line="${esc(snippet)}">${t("finder.copy_line")}</button>`;
  const blockBtn = block == null ? "" :
    `<button type="button" class="btn-sm snip-copy" data-snip-block="${esc(block)}">${t("finder.copy_block")}</button>`;
  return `<div class="snip"><code>${esc(snippet)}</code>` +
    `<span class="snip-actions">${lineBtn}${blockBtn}</span></div>`;
}

function renderGenres(rows) {
  const tb = document.querySelector("#dz-genres tbody");

async function loadGenres() {
  try {
    const r = await fetch("/api/sources/deezer/genres", {cache: "no-store"});

// Reusable client-side sortable table for the finder result boxes.
// columns: [{ label, get(item), type: "string"|"number"|"raw", sortable }].
// A "raw" column (the snippet) renders HTML verbatim and is never sortable.
// defaultIdx picks the initial sort column; it starts descending so the
// highest numeric value (most tracks / most fans) is on top.
function renderSortableTable(box, items, columns, defaultIdx) {
  let sortIdx = defaultIdx;
  let sortDir = -1;   // -1 = descending, 1 = ascending

  const cmp = (a, b) => {
    const col = columns[sortIdx];
    if (col.type === "number") {
      const na = Number(col.get(a)), nb = Number(col.get(b));
      const va = isNaN(na) ? -Infinity : na;
      const vb = isNaN(nb) ? -Infinity : nb;
      return (va - vb) * sortDir;
    }
    const sa = String(col.get(a) == null ? "" : col.get(a));
    const sb = String(col.get(b) == null ? "" : col.get(b));
    return sa.localeCompare(sb, undefined, {sensitivity: "base"}) * sortDir;
  };

  const draw = () => {
    const sorted = columns[sortIdx].sortable ? items.slice().sort(cmp) : items;
    const head = columns.map((col, i) => {
      if (!col.sortable) return `<th>${col.label}</th>`;
      const arrow = (i === sortIdx) ? (sortDir === 1 ? " ▲" : " ▼") : "";
      return `<th class="sortable" data-col="${i}" role="button" ` +
        `tabindex="0">${col.label}${arrow}</th>`;
    }).join("");
    const body = sorted.map(it =>
      "<tr>" + columns.map(col =>
        col.type === "raw"
          ? `<td>${col.get(it)}</td>`
          : `<td class="${col.type === "number" ? "mono" : ""}">${esc(col.get(it))}</td>`
      ).join("") + "</tr>").join("");
    box.innerHTML =
      `<table class="finder-table"><thead><tr>${head}</tr></thead>` +
      `<tbody>${body}</tbody></table>`;
    box.querySelectorAll("th.sortable").forEach(th => {
      const activate = () => {
        const i = Number(th.dataset.col);
        if (i === sortIdx) { sortDir = -sortDir; }
        else { sortIdx = i; sortDir = -1; }
        draw();
      };
      th.addEventListener("click", activate);
      th.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  };
  draw();
}

async function searchDeezerPlaylists(q) {
  const box = document.getElementById("dz-pl-results");
  if (!box) return;
  box.innerHTML = `<div class="muted-txt">${t("finder.searching")}</div>`;
  try {
    const r = await fetch("/api/sources/deezer/playlists?q=" + encodeURIComponent(q),
      {cache: "no-store"});
    const d = await r.json();
    if (!d || !d.ok) {
      box.innerHTML = `<div class="s-err">${esc((d && d.detail) || t("finder.generic_error"))}</div>`;
      return;
    }
    if (!d.results.length) {
      box.innerHTML = `<div class="muted-txt">${t("finder.no_hits")}</div>`;
      return;
    }
    renderSortableTable(box, d.results, [
      {label: t("finder.col.title"), get: p => p.title, type: "string", sortable: true},
      {label: t("finder.col.tracks"), get: p => p.nb_tracks, type: "number", sortable: true},
      {label: t("finder.col.snippet"), get: p => snippetCell(p.snippet), type: "raw", sortable: false},
    ], 1);   // default sort: Tracks, descending
  } catch (e) {
    box.innerHTML = `<div class="s-err">${t("finder.unreachable")}</div>`;
  }
}
