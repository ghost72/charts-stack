<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="doc_title">Song Request</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#7b4397">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songs">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar"><a href="/logout" data-i18n="logout">Abmelden</a></div>
  <div class="card">
    <div class="logo">🎵</div>
    <h1 data-i18n="heading">Song Request</h1>
    <div class="subtitle" data-i18n="subtitle">Song suchen, laden und in die Library holen</div>

    <form id="form">
      <label for="artist" data-i18n="label_artist">Künstler</label>
      <input id="artist" name="artist" type="text" data-i18n-ph="ph_artist" placeholder="z. B. Dermot Kennedy" autocomplete="off" autofocus>

      <label for="title" data-i18n="label_title">Titel</label>
      <input id="title" name="title" type="text" data-i18n-ph="ph_title" placeholder="z. B. Kiss Me" autocomplete="off">

      <button id="btn" type="submit" data-i18n="btn_search">Suchen &amp; laden</button>
    </form>

    <div id="status" class="status"></div>

    <div class="hint" data-i18n-html="hint">Nur Originalversionen · MP3 ≥ 256 kbps<br>Import erfolgt automatisch über charts-import</div>
  </div>

  <div class="card">
    <h1 data-i18n="upload_heading">Song hochladen</h1>

    <form id="upform">
      <input id="upfile" name="file" type="file" accept="audio/mpeg,.mp3">

      <label for="up_artist" data-i18n="label_artist">Künstler</label>
      <input id="up_artist" name="artist" type="text" data-i18n-ph="ph_artist" placeholder="z. B. Dermot Kennedy" autocomplete="off">

      <label for="up_title" data-i18n="label_title">Titel</label>
      <input id="up_title" name="title" type="text" data-i18n-ph="ph_title" placeholder="z. B. Kiss Me" autocomplete="off">

      <button id="upbtn" type="submit" data-i18n="upload_btn">Hochladen &amp; prüfen</button>
    </form>

    <div id="upstatus" class="status"></div>

    <div class="hint" data-i18n="upload_hint">Nur MP3 · benannt "Künstler - Titel.mp3"</div>
  </div>

<script>
// Injected i18n subset (songrequest.ui.* re-based) + client translator. Mirrors
// the Python loader's {name} substitution (split/join, not regex) and its
// missing-key -> key-name fallback. English fallback is already merged in by
// the server before injection.
const I18N = {{I18N}};
function t(key, params) {
  let s = I18N[key];
  if (s === undefined) return key;
  if (params) for (const k in params)
    s = s.split("{" + k + "}").join(String(params[k]));
  return s;
}
// One-shot static-markup sweep: textContent for [data-i18n], placeholder for
// [data-i18n-ph], innerHTML for [data-i18n-html] (the hint line carries inert
// <br> markup). Runs once at the end of this script.
function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
}

const form = document.getElementById('form');
const btn = document.getElementById('btn');
const status = document.getElementById('status');

function showStatus(cls, iconHtml, html) {
  status.className = 'status show ' + cls;
  status.innerHTML = '<span class="ic">' + iconHtml + '</span><span>' + html + '</span>';
}

function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function sendRequest(artist, title) {
  btn.disabled = true;
  btn.textContent = t('btn_searching');
  showStatus('searching', '<span class="spinner"></span>', t('js_searching'));

  try {
    const resp = await fetch('/api/request', {
      method: 'POST', body: new URLSearchParams({ artist, title })
    });
    const data = await resp.json();

    if (data.ok && data.upgrade) {
      // Bessere Version gefunden -> wird automatisch geladen.
      var newBr = data.bitrate > 0 ? (data.bitrate + ' kbps') : ('≥ ' + 256 + ' kbps');
      showStatus('ok', '⬆️',
        t('js_upgrade_head') + '<br>' +
        esc(data.artist) + ' – ' + esc(data.title) + '<br>' +
        '<span style="color:rgba(255,255,255,0.55)">' +
        t('js_upgrade_tail', {new: newBr, old: data.old_bitrate}) + '</span>');
      form.reset();
      document.getElementById('artist').focus();
    } else if (data.ok && data.already) {
      // Vorhanden, nichts (Besseres) geladen. Die genaue Aussage kommt vom
      // Backend (data.message): entweder "schon in guter Qualität" ODER
      // ehrlich "vorhanden mit X kbps, nichts Besseres gefunden". NICHT
      // hart "beste Qualität" anzeigen - das war falsch bei Low-Bitrate-Songs.
      showStatus('ok', 'ℹ️',
        esc(data.artist) + ' – ' + esc(data.title) +
        (data.bitrate ? ' (' + data.bitrate + ' kbps)' : '') + '<br>' +
        '<span style="color:rgba(255,255,255,0.55)">' +
        esc(data.message || t('js_no_download')) + '</span>');
      form.reset();
      document.getElementById('artist').focus();
    } else if (data.ok) {
      // Neuzugang.
      showStatus('ok', '✅',
        t('js_found_head') + '<br>' +
        esc(data.artist) + ' – ' + esc(data.title) + ' (' + data.bitrate + ' kbps)<br>' +
        '<span style="color:rgba(255,255,255,0.55)">' + t('js_found_tail') + '</span>');
      form.reset();
      document.getElementById('artist').focus();
    } else {
      showStatus('err', '⚠️', esc(data.error) || t('js_unknown_error'));
    }
  } catch (err) {
    showStatus('err', '⚠️', t('js_network_error'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('btn_search');
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const artist = document.getElementById('artist').value.trim();
  const title = document.getElementById('title').value.trim();
  if (!artist || !title) {
    showStatus('err', '⚠️', t('js_need_fields'));
    return;
  }
  sendRequest(artist, title);
});

// --- Manual MP3 upload -----------------------------------------------------
const upform = document.getElementById('upform');
const upbtn = document.getElementById('upbtn');
const upfile = document.getElementById('upfile');
const upartist = document.getElementById('up_artist');
const uptitle = document.getElementById('up_title');
const upstatus = document.getElementById('upstatus');
// Token of a staged sub-threshold upload awaiting "add it anyway".
let upPendingToken = null;

function showUpStatus(cls, iconHtml, html) {
  upstatus.className = 'status show ' + cls;
  upstatus.innerHTML = '<span class="ic">' + iconHtml + '</span><span>' + html + '</span>';
}

// Mirror parse_upload_name: split the basename on the FIRST " - ".
function parseUploadName(name) {
  const base = name.replace(/\\/g, '/').split('/').pop().replace(/\.[^.]+$/, '');
  const i = base.indexOf(' - ');
  if (i >= 0) return [base.slice(0, i).trim(), base.slice(i + 3).trim()];
  return ['', base.trim()];
}

upfile.addEventListener('change', () => {
  upPendingToken = null;
  const f = upfile.files && upfile.files[0];
  if (!f) return;
  // Pre-fill the editable fields from the filename.
  const [a, ti] = parseUploadName(f.name);
  upartist.value = a;
  uptitle.value = ti;
  // Early, friendly client-side extension warning (server is authoritative).
  if (!/\.mp3$/i.test(f.name)) {
    showUpStatus('err', '⚠️', t('js_upload_not_mp3'));
  } else {
    upstatus.className = 'status';
  }
});

async function sendConfirm() {
  upbtn.disabled = true;
  showUpStatus('searching', '<span class="spinner"></span>', t('js_uploading'));
  try {
    const resp = await fetch('/api/upload/confirm', {
      method: 'POST', body: new URLSearchParams({
        token: upPendingToken,
        artist: upartist.value.trim(),
        title: uptitle.value.trim(),
      })
    });
    const data = await resp.json();
    renderUpload(data);
  } catch (err) {
    showUpStatus('err', '⚠️', t('js_network_error'));
  } finally {
    upbtn.disabled = false;
  }
}

function renderUpload(data) {
  if (data.ok && data.needs_confirm) {
    // Below threshold, nothing better online -> honest message + confirm button.
    upPendingToken = data.token;
    showUpStatus('ok', 'ℹ️',
      esc(data.message) + '<br>' +
      '<button type="button" id="upconfirm">' + esc(t('js_upload_confirm_btn')) + '</button>');
    document.getElementById('upconfirm').addEventListener('click', sendConfirm);
  } else if (data.ok && data.accepted) {
    upPendingToken = null;
    showUpStatus('ok', '✅',
      t('js_upload_accepted') + '<br>' +
      esc(data.artist) + ' – ' + esc(data.title) + ' (' + data.bitrate + ' kbps)<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' + esc(data.message) + '</span>');
    upform.reset();
  } else if (data.ok && data.upgrade) {
    // A better version was found online and is downloading instead.
    upPendingToken = null;
    var newBr = data.bitrate > 0 ? (data.bitrate + ' kbps') : ('≥ ' + 256 + ' kbps');
    showUpStatus('ok', '⬆️',
      t('js_upgrade_head') + '<br>' +
      esc(data.artist) + ' – ' + esc(data.title) + '<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' +
      t('js_upgrade_tail', {new: newBr, old: data.old_bitrate}) + '</span>');
    upform.reset();
  } else if (data.ok) {
    // New addition downloaded from slskd instead of the uploaded file.
    upPendingToken = null;
    showUpStatus('ok', '✅',
      t('js_found_head') + '<br>' +
      esc(data.artist) + ' – ' + esc(data.title) + ' (' + data.bitrate + ' kbps)<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' + t('js_found_tail') + '</span>');
    upform.reset();
  } else {
    showUpStatus('err', '⚠️', esc(data.error) || t('js_unknown_error'));
  }
}

upform.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = upfile.files && upfile.files[0];
  if (!f) {
    showUpStatus('err', '⚠️', t('js_upload_not_mp3'));
    return;
  }
  if (!uptitle.value.trim()) {
    showUpStatus('err', '⚠️', t('js_upload_need_title'));
    return;
  }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('artist', upartist.value.trim());
  fd.append('title', uptitle.value.trim());
  upbtn.disabled = true;
  upPendingToken = null;
  showUpStatus('searching', '<span class="spinner"></span>', t('js_uploading'));
  try {
    const resp = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await resp.json();
    renderUpload(data);
  } catch (err) {
    showUpStatus('err', '⚠️', t('js_network_error'));
  } finally {
    upbtn.disabled = false;
  }
});

applyStaticI18n();
</script>
</body>
</html>
