<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="doc_title">Song Request</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#7b4397">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songs">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar"><a href="/logout" data-i18n="logout">Abmelden</a></div>
  <div class="card">
    <div class="logo">🎵</div>
    <h1 data-i18n="heading">Song Request</h1>
    <div class="subtitle" data-i18n="subtitle">Song suchen, laden und in die Library holen</div>

    <!-- Tab bar: switch between the search/download form and the manual upload
         form inside this single card. Request tab is active on load. -->
    <div class="tabs">
      <button type="button" class="tab active" data-tab="request" data-i18n="tab_request">Song Request</button>
      <button type="button" class="tab" data-tab="upload" data-i18n="tab_upload">Song Upload</button>
      <button type="button" class="tab" data-tab="youtube" data-i18n="tab_youtube">Song von YouTube</button>
    </div>

    <!-- Request pane (default visible): search slskd and download. -->
    <div class="tabpane" data-pane="request">
      <form id="form">
        <label for="artist" data-i18n="label_artist">Künstler</label>
        <input id="artist" name="artist" type="text" data-i18n-ph="ph_artist" placeholder="z. B. Dermot Kennedy" autocomplete="off" autofocus>

        <label for="title" data-i18n="label_title">Titel</label>
        <input id="title" name="title" type="text" data-i18n-ph="ph_title" placeholder="z. B. Kiss Me" autocomplete="off">

        <button id="btn" type="submit" data-i18n="btn_search">Suchen &amp; laden</button>
      </form>

      <div id="status" class="status"></div>

      <div class="hint" data-i18n-html="hint">Nur Originalversionen · MP3 ≥ 256 kbps<br>Import erfolgt automatisch über charts-import</div>
    </div>

    <!-- Upload pane (hidden until its tab is selected): manual MP3 upload. -->
    <div class="tabpane" data-pane="upload" hidden>
      <form id="upform">
        <input id="upfile" name="file" type="file" accept="audio/mpeg,.mp3">

        <label for="up_artist" data-i18n="label_artist">Künstler</label>
        <input id="up_artist" name="artist" type="text" data-i18n-ph="ph_artist" placeholder="z. B. Dermot Kennedy" autocomplete="off">

        <label for="up_title" data-i18n="label_title">Titel</label>
        <input id="up_title" name="title" type="text" data-i18n-ph="ph_title" placeholder="z. B. Kiss Me" autocomplete="off">

        <button id="upbtn" type="submit" data-i18n="upload_btn">Hochladen &amp; prüfen</button>
      </form>

      <div id="upstatus" class="status"></div>

      <div class="hint" data-i18n="upload_hint">Nur MP3 · benannt "Künstler - Titel.mp3"</div>
    </div>

    <!-- YouTube pane (hidden until its tab is selected): paste a YouTube URL,
         the artist/title are suggested from the video metadata and editable. -->
    <div class="tabpane" data-pane="youtube" hidden>
      <form id="ytform">
        <label for="yt_url" data-i18n="yt_url_label">YouTube-URL</label>
        <input id="yt_url" name="url" type="text" data-i18n-ph="yt_url_ph" placeholder="z. B. https://www.youtube.com/watch?v=…" autocomplete="off">

        <label for="yt_artist" data-i18n="label_artist">Künstler</label>
        <input id="yt_artist" name="artist" type="text" data-i18n-ph="ph_artist" placeholder="z. B. Dermot Kennedy" autocomplete="off">

        <label for="yt_title" data-i18n="label_title">Titel</label>
        <input id="yt_title" name="title" type="text" data-i18n-ph="ph_title" placeholder="z. B. Kiss Me" autocomplete="off">

        <button id="ytbtn" type="submit" data-i18n="yt_btn">Laden &amp; übernehmen</button>
      </form>

      <div id="ytstatus" class="status"></div>

      <div class="hint" data-i18n="yt_hint">YouTube-Link einfügen · Künstler/Titel werden vorgeschlagen, bei Bedarf anpassen</div>
    </div>

    <!-- Hidden iOS Taptic switch. Toggling an <input type="checkbox" switch>
         inside a real user gesture fires the Taptic engine on iOS Safari
         17.4+; Android ignores it (it uses navigator.vibrate instead). Kept
         off-screen via the .haptic-switch clip rule (NOT display:none, which
         would suppress the haptic). No aria-hidden, so the localized
         aria-label stays announceable; tabindex="-1" keeps it out of tab order. -->
    <input type="checkbox" switch id="haptic-switch" data-i18n-aria="haptic_switch_label" aria-label="Haptic feedback (internal)" tabindex="-1" class="haptic-switch">
  </div>

<script>
// Injected i18n subset (songrequest.ui.* re-based) + client translator. Mirrors
// the Python loader's {name} substitution (split/join, not regex) and its
// missing-key -> key-name fallback. English fallback is already merged in by
// the server before injection.
const I18N = {{I18N}};
function t(key, params) {
  let s = I18N[key];
  if (s === undefined) return key;
  if (params) for (const k in params)
    s = s.split("{" + k + "}").join(String(params[k]));
  return s;
}
// One-shot static-markup sweep: textContent for [data-i18n], placeholder for
// [data-i18n-ph], innerHTML for [data-i18n-html] (the hint line carries inert
// <br> markup). Runs once at the end of this script.
function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  // aria-label sweep: localize [data-i18n-aria] elements (the hidden haptic
  // switch). The hardcoded English aria-label in the markup is the fallback.
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    el.setAttribute("aria-label", t(el.dataset.i18nAria));
  });
}

const form = document.getElementById('form');
const btn = document.getElementById('btn');
const status = document.getElementById('status');

function showStatus(cls, iconHtml, html) {
  status.className = 'status show ' + cls;
  status.innerHTML = '<span class="ic">' + iconHtml + '</span><span>' + html + '</span>';
}

function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// --- Guarded fetch: survive a mobile app-switch mid-request ----------------
// On iOS Safari, backgrounding the page (switching apps) suspends the JS
// runtime and can silently drop an in-flight fetch. The awaited Promise then
// never settles, the finally never runs, and the submit button stays stuck on
// a dead spinner. We bound every in-flight request with an AbortController +
// timeout and, on return to visibility, abort anything still pending so the UI
// recovers with an honest "connection interrupted" status.
//
// Correctness note: the abort ONLY unsticks the client UI. The server-side
// work (slskd search/download, manifest write, charts-import pickup) keeps
// running regardless - AbortController cannot cancel work the server already
// started. If the user retries after a lost connection the request may be sent
// twice, which is acceptable: the server path is effectively idempotent for
// our purpose (charts-import dedupes on the manifest/library level and a
// duplicate slskd enqueue for the same song resolves to the same file). We
// therefore prefer the simple "un-stick + let the user retry" over trying to
// resume the original request. The debounced /api/youtube/fetch suggestion
// stays unguarded on purpose (it already fails soft and has no spinner lock).

// 75 s sits in the requested 60-90 s band: comfortably above a normal
// successful request (the slskd search + verify-transfer path can legitimately
// take tens of seconds) yet bounded so a genuinely hung fetch is surfaced.
const REQUEST_TIMEOUT_MS = 75000;

// Plain-object sentinel (NOT a Symbol): a thrown Symbol has no .aborted
// property, which would break the caller's `err && err.aborted` check and
// render the generic network error on top of the already-shown lost status.
const ABORTED = { aborted: true };

// Registry of in-flight guarded requests so the visibility sweep can find and
// abort anything still pending.
const inflight = new Set();

// fetch wrapper that aborts on timeout or on the visibility sweep. Returns the
// resolved Response (callers keep their own `await resp.json()`). On a guarded
// abort it calls onLost() exactly once, then throws the ABORTED sentinel so the
// caller's existing catch can skip its generic error render.
async function fetchGuarded(url, options, onLost) {
  let lost = false;
  const fire = () => { if (!lost) { lost = true; if (onLost) onLost(); } };
  // Degrade gracefully if AbortController is unavailable (ancient browser):
  // keep the timer so onLost still fires; the fetch just is not truly aborted
  // (harmless - the server keeps running).
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const entry = { ac: ac, fire: fire };
  inflight.add(entry);
  const timer = setTimeout(() => {
    if (ac) ac.abort(new DOMException('timeout', 'AbortError'));
    else fire();
  }, REQUEST_TIMEOUT_MS);
  try {
    const init = ac ? Object.assign({}, options, { signal: ac.signal }) : options;
    const resp = await fetch(url, init);
    return resp;
  } catch (err) {
    // An AbortError means we abandoned this request (timeout or sweep): render
    // the lost status once and signal the caller via the sentinel.
    if (err && err.name === 'AbortError') {
      fire();
      throw ABORTED;
    }
    throw err;
  } finally {
    clearTimeout(timer);
    inflight.delete(entry);
  }
}

// Abort every still-pending guarded request. Each abort rejects its fetch,
// which runs the helper's onLost path (lost status + finally re-enables the
// button). Requests that already settled are not in `inflight`, so untouched.
function abandonInflight() {
  for (const entry of inflight) {
    if (entry.ac) entry.ac.abort(new DOMException('backgrounded', 'AbortError'));
    else entry.fire();
  }
}

// Only sweep on RETURN to visible (or bfcache restore), not on going hidden, so
// a quick glance away that iOS does not actually suspend is not punished.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') abandonInflight();
});
// pageshow with persisted=true covers the bfcache restore case where
// visibilitychange may not fire.
window.addEventListener('pageshow', (e) => {
  if (e.persisted) abandonInflight();
});

// --- Haptics ---------------------------------------------------------------
// Dependency-free tactile feedback. No UA sniffing: we feature-detect
// navigator.vibrate (Android has it, iOS does not) AND independently toggle the
// hidden iOS switch (iOS reacts to a toggle inside a user gesture, Android
// ignores a hidden checkbox). Both run; each platform ignores the one that does
// not apply. Silent no-op if neither is available - never throws.
function haptic(kind) {
  try {
    if (navigator.vibrate) {
      if (kind === 'tap') navigator.vibrate(10);
      else if (kind === 'success') navigator.vibrate([15, 40, 15]);
      else if (kind === 'attention') navigator.vibrate([0, 30, 60, 30]);
    }
    // iOS Taptic path only for the user-gesture kinds. 'attention' is NOT
    // user-initiated, so toggling is unreliable there - the visual pulse
    // carries that case instead.
    if (kind === 'tap' || kind === 'success') {
      const s = document.getElementById('haptic-switch');
      if (s) s.checked = !s.checked;
    }
  } catch (e) { /* never let haptics break a handler */ }
}

// One-shot attention pulse on an element. The reflow (void el.offsetWidth)
// restarts the animation so it can re-fire; the class is removed on animationend
// so it never sticks. box-shadow only -> no layout shift.
function pulse(el) {
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  el.addEventListener('animationend', () => el.classList.remove('pulse'), { once: true });
}

// "Interaction expected but not user-initiated" signal: cross-platform visual
// pulse + best-effort Android vibrate (iOS cannot reliably vibrate here).
function attention(el) { pulse(el); haptic('attention'); }

async function sendRequest(artist, title) {
  btn.disabled = true;
  btn.textContent = t('btn_searching');
  showStatus('searching', '<span class="spinner"></span>', t('js_searching'));

  try {
    const resp = await fetchGuarded('/api/request', {
      method: 'POST', body: new URLSearchParams({ artist, title })
    }, () => showStatus('err', '⚠️', t('js_connection_lost')));
    const data = await resp.json();

    if (data.ok && data.upgrade) {
      // Bessere Version gefunden -> wird automatisch geladen.
      var newBr = data.bitrate > 0 ? (data.bitrate + ' kbps') : ('≥ ' + 256 + ' kbps');
      showStatus('ok', '⬆️',
        t('js_upgrade_head') + '<br>' +
        esc(data.artist) + ' – ' + esc(data.title) + '<br>' +
        '<span style="color:rgba(255,255,255,0.55)">' +
        t('js_upgrade_tail', {new: newBr, old: data.old_bitrate}) + '</span>');
      form.reset();
      document.getElementById('artist').focus();
    } else if (data.ok && data.already) {
      // Vorhanden, nichts (Besseres) geladen. Die genaue Aussage kommt vom
      // Backend (data.message): entweder "schon in guter Qualität" ODER
      // ehrlich "vorhanden mit X kbps, nichts Besseres gefunden". NICHT
      // hart "beste Qualität" anzeigen - das war falsch bei Low-Bitrate-Songs.
      showStatus('ok', 'ℹ️',
        esc(data.artist) + ' – ' + esc(data.title) +
        (data.bitrate ? ' (' + data.bitrate + ' kbps)' : '') + '<br>' +
        '<span style="color:rgba(255,255,255,0.55)">' +
        esc(data.message || t('js_no_download')) + '</span>');
      form.reset();
      document.getElementById('artist').focus();
    } else if (data.ok) {
      // Neuzugang.
      showStatus('ok', '✅',
        t('js_found_head') + '<br>' +
        esc(data.artist) + ' – ' + esc(data.title) + ' (' + data.bitrate + ' kbps)<br>' +
        '<span style="color:rgba(255,255,255,0.55)">' + t('js_found_tail') + '</span>');
      form.reset();
      document.getElementById('artist').focus();
    } else {
      showStatus('err', '⚠️', esc(data.error) || t('js_unknown_error'));
    }
  } catch (err) {
    if (err && err.aborted) return;  // guarded abort already rendered the lost status
    showStatus('err', '⚠️', t('js_network_error'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('btn_search');
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  haptic('tap');
  const artist = document.getElementById('artist').value.trim();
  const title = document.getElementById('title').value.trim();
  if (!artist || !title) {
    showStatus('err', '⚠️', t('js_need_fields'));
    return;
  }
  sendRequest(artist, title);
});

// --- Manual MP3 upload -----------------------------------------------------
const upform = document.getElementById('upform');
const upbtn = document.getElementById('upbtn');
const upfile = document.getElementById('upfile');
const upartist = document.getElementById('up_artist');
const uptitle = document.getElementById('up_title');
const upstatus = document.getElementById('upstatus');
// Token of a staged sub-threshold upload awaiting "add it anyway".
let upPendingToken = null;

function showUpStatus(cls, iconHtml, html) {
  upstatus.className = 'status show ' + cls;
  upstatus.innerHTML = '<span class="ic">' + iconHtml + '</span><span>' + html + '</span>';
}

// Mirror parse_upload_name: split the basename on the FIRST " - ".
function parseUploadName(name) {
  const base = name.replace(/\\/g, '/').split('/').pop().replace(/\.[^.]+$/, '');
  const i = base.indexOf(' - ');
  if (i >= 0) return [base.slice(0, i).trim(), base.slice(i + 3).trim()];
  return ['', base.trim()];
}

upfile.addEventListener('change', () => {
  upPendingToken = null;
  const f = upfile.files && upfile.files[0];
  if (!f) return;
  // Pre-fill the editable fields from the filename.
  const [a, ti] = parseUploadName(f.name);
  upartist.value = a;
  uptitle.value = ti;
  // Early, friendly client-side extension warning (server is authoritative).
  if (!/\.mp3$/i.test(f.name)) {
    showUpStatus('err', '⚠️', t('js_upload_not_mp3'));
  } else {
    upstatus.className = 'status';
  }
});

async function sendConfirm() {
  upbtn.disabled = true;
  showUpStatus('searching', '<span class="spinner"></span>', t('js_uploading'));
  try {
    const resp = await fetchGuarded('/api/upload/confirm', {
      method: 'POST', body: new URLSearchParams({
        token: upPendingToken,
        artist: upartist.value.trim(),
        title: uptitle.value.trim(),
      })
    }, () => showUpStatus('err', '⚠️', t('js_connection_lost')));
    const data = await resp.json();
    renderUpload(data);
  } catch (err) {
    if (err && err.aborted) return;  // guarded abort already rendered the lost status
    showUpStatus('err', '⚠️', t('js_network_error'));
  } finally {
    upbtn.disabled = false;
  }
}

function renderUpload(data) {
  if (data.ok && data.needs_confirm) {
    // Below threshold, nothing better online -> honest message + confirm button.
    upPendingToken = data.token;
    showUpStatus('ok', 'ℹ️',
      esc(data.message) + '<br>' +
      '<button type="button" id="upconfirm">' + esc(t('js_upload_confirm_btn')) + '</button>');
    document.getElementById('upconfirm').addEventListener('click', () => { haptic('tap'); sendConfirm(); });
    // Waiting-for-decision state: draw the eye to the confirm button the user
    // must now decide on (visual pulse + best-effort Android vibrate).
    attention(document.getElementById('upconfirm'));
  } else if (data.ok && data.accepted) {
    upPendingToken = null;
    showUpStatus('ok', '✅',
      t('js_upload_accepted') + '<br>' +
      esc(data.artist) + ' – ' + esc(data.title) + ' (' + data.bitrate + ' kbps)<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' + esc(data.message) + '</span>');
    upform.reset();
  } else if (data.ok && data.upgrade) {
    // A better version was found online and is downloading instead.
    upPendingToken = null;
    var newBr = data.bitrate > 0 ? (data.bitrate + ' kbps') : ('≥ ' + 256 + ' kbps');
    showUpStatus('ok', '⬆️',
      t('js_upgrade_head') + '<br>' +
      esc(data.artist) + ' – ' + esc(data.title) + '<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' +
      t('js_upgrade_tail', {new: newBr, old: data.old_bitrate}) + '</span>');
    upform.reset();
  } else if (data.ok) {
    // New addition downloaded from slskd instead of the uploaded file.
    upPendingToken = null;
    showUpStatus('ok', '✅',
      t('js_found_head') + '<br>' +
      esc(data.artist) + ' – ' + esc(data.title) + ' (' + data.bitrate + ' kbps)<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' + t('js_found_tail') + '</span>');
    upform.reset();
  } else {
    showUpStatus('err', '⚠️', esc(data.error) || t('js_unknown_error'));
  }
}

upform.addEventListener('submit', async (e) => {
  e.preventDefault();
  haptic('tap');
  const f = upfile.files && upfile.files[0];
  if (!f) {
    showUpStatus('err', '⚠️', t('js_upload_not_mp3'));
    return;
  }
  if (!uptitle.value.trim()) {
    showUpStatus('err', '⚠️', t('js_upload_need_title'));
    return;
  }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('artist', upartist.value.trim());
  fd.append('title', uptitle.value.trim());
  upbtn.disabled = true;
  upPendingToken = null;
  showUpStatus('searching', '<span class="spinner"></span>', t('js_uploading'));
  try {
    const resp = await fetchGuarded('/api/upload', { method: 'POST', body: fd },
      () => showUpStatus('err', '⚠️', t('js_connection_lost')));
    const data = await resp.json();
    renderUpload(data);
  } catch (err) {
    if (err && err.aborted) return;  // guarded abort already rendered the lost status
    showUpStatus('err', '⚠️', t('js_network_error'));
  } finally {
    upbtn.disabled = false;
  }
});

// --- YouTube URL import ----------------------------------------------------
const ytform = document.getElementById('ytform');
const ytbtn = document.getElementById('ytbtn');
const yturl = document.getElementById('yt_url');
const ytartist = document.getElementById('yt_artist');
const yttitle = document.getElementById('yt_title');
const ytstatus = document.getElementById('ytstatus');
// Set once the user edits a field so a late metadata fetch never clobbers it.
let ytArtistTouched = false;
let ytTitleTouched = false;
let ytFetchTimer = null;

function showYtStatus(cls, iconHtml, html) {
  ytstatus.className = 'status show ' + cls;
  ytstatus.innerHTML = '<span class="ic">' + iconHtml + '</span><span>' + html + '</span>';
}

ytartist.addEventListener('input', () => { ytArtistTouched = true; });
yttitle.addEventListener('input', () => { ytTitleTouched = true; });

// Fetch the metadata suggestion and pre-fill ONLY the fields the user has not
// touched (never clobber what they typed). Fails soft: on error the fields
// stay as they are and the user can type/submit anyway.
async function fetchYtSuggestion() {
  const u = yturl.value.trim();
  if (!u) return;
  showYtStatus('searching', '<span class="spinner"></span>', t('js_yt_fetching'));
  try {
    const resp = await fetch('/api/youtube/fetch', {
      method: 'POST', body: new URLSearchParams({ url: u })
    });
    const data = await resp.json();
    if (data.ok) {
      if (!ytArtistTouched && data.artist) ytartist.value = data.artist;
      if (!ytTitleTouched && data.title) yttitle.value = data.title;
      ytstatus.className = 'status';
    } else {
      showYtStatus('err', '⚠️', esc(data.error) || t('yt_fetch_failed'));
    }
  } catch (err) {
    // Network error on the suggestion is non-fatal: keep the fields, let the
    // user fill them and submit.
    ytstatus.className = 'status';
  }
}

yturl.addEventListener('blur', fetchYtSuggestion);
yturl.addEventListener('input', () => {
  // Debounce: fetch ~600 ms after the last change. A new URL re-enables the
  // pre-fill (treat it as a fresh video).
  ytArtistTouched = false;
  ytTitleTouched = false;
  if (ytFetchTimer) clearTimeout(ytFetchTimer);
  ytFetchTimer = setTimeout(fetchYtSuggestion, 600);
});

function renderYoutube(data) {
  if (data.ok && data.already) {
    // Already present, nothing downloaded. Honest backend message.
    showYtStatus('ok', 'ℹ️',
      esc(data.artist) + ' – ' + esc(data.title) +
      (data.bitrate ? ' (' + data.bitrate + ' kbps)' : '') + '<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' +
      esc(data.message || t('js_no_download')) + '</span>');
  } else if (data.ok && data.accepted) {
    showYtStatus('ok', '✅',
      t('js_yt_accepted') + '<br>' +
      esc(data.artist) + ' – ' + esc(data.title) + '<br>' +
      '<span style="color:rgba(255,255,255,0.55)">' + esc(data.message) + '</span>');
    ytform.reset();
    ytArtistTouched = false;
    ytTitleTouched = false;
  } else {
    showYtStatus('err', '⚠️', esc(data.error) || t('js_unknown_error'));
  }
}

ytform.addEventListener('submit', async (e) => {
  e.preventDefault();
  haptic('tap');
  const u = yturl.value.trim();
  if (!u) {
    showYtStatus('err', '⚠️', t('js_yt_need_url'));
    return;
  }
  if (ytFetchTimer) clearTimeout(ytFetchTimer);
  ytbtn.disabled = true;
  showYtStatus('searching', '<span class="spinner"></span>', t('js_yt_downloading'));
  try {
    const resp = await fetchGuarded('/api/youtube', {
      method: 'POST', body: new URLSearchParams({
        url: u,
        artist: ytartist.value.trim(),
        title: yttitle.value.trim(),
      })
    }, () => showYtStatus('err', '⚠️', t('js_connection_lost')));
    const data = await resp.json();
    renderYoutube(data);
  } catch (err) {
    if (err && err.aborted) return;  // guarded abort already rendered the lost status
    showYtStatus('err', '⚠️', t('js_network_error'));
  } finally {
    ytbtn.disabled = false;
  }
});

// --- Tab switcher ----------------------------------------------------------
// Toggle which pane is visible inside the single card. Pure layout: no form
// field, element ID, or request logic is touched.
const tabButtons = document.querySelectorAll('.tab');
tabButtons.forEach(tab => {
  tab.addEventListener('click', () => {
    haptic('tap');
    const target = tab.dataset.tab;
    tabButtons.forEach(b => b.classList.toggle('active', b === tab));
    document.querySelectorAll('[data-pane]').forEach(p => {
      p.hidden = p.dataset.pane !== target;
    });
  });
});

applyStaticI18n();
</script>
</body>
