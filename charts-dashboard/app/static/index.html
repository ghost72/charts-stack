</main>

<script>
const REFRESH = {{REFRESH}};
// Injected i18n subset (dashboard.ui.* re-based) + client translator. Mirrors
// the Python loader's {name} substitution (split/join, not regex) and its
// missing-key -> key-name fallback. English fallback is already merged in by
// the server before injection.
const I18N = {{I18N}};
function t(key, params) {
  let s = I18N[key];
  if (s === undefined) return key;
  if (params) for (const k in params)
    s = s.split("{" + k + "}").join(String(params[k]));
  return s;
}
// One-shot static-markup sweep: textContent for [data-i18n], placeholder for
// [data-i18n-ph], innerHTML for [data-i18n-html] (nodes carrying inert markup
// like the finder hint's <code> and the donate label). Runs once at the end of
// this script, independent of the first /api/status poll.
function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
}

function fmtBytes(b) {
  if (b == null) return "–";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 10 || i === 0 ? 0 : 1) + " " + u[i];
}

function ago(iso) {
  if (!iso) return t("time.never");
  const ts = Date.parse(iso);
  if (isNaN(ts)) return iso;
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + t("time.unit.s");
  if (s < 3600) return Math.floor(s/60) + t("time.unit.min");
  if (s < 86400) return Math.floor(s/3600) + t("time.unit.h");
  return Math.floor(s/86400) + t("time.unit.d");
}

function tile(cls, title, lines) {
  const body = lines.map(l => `<div class="line">${l}</div>`).join("");
  return `<div class="tile ${cls}"><div class="t-title">${title}</div>${body}</div>`;
}

// Draws the flow connections as SVG paths between the REAL tile positions
// (getBoundingClientRect). This keeps the lines correct in every layout -
// desktop, iPad, phone - and redraws them on resize/orientation. Edges: each
// source + manual -> each getter; each getter -> slskd; slskd -> import;
// import -> navidrome.
function drawFlowLines() {
  const hub = document.querySelector(".flow-hub");
  const svg = hub && hub.querySelector(".flow-svg");
  if (!hub || !svg) return;
  const box = hub.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
  svg.setAttribute("width", box.width);
  svg.setAttribute("height", box.height);

  const cellRect = (name) => {
    const el = hub.querySelector(`[data-cell="${name}"] .tile`) ||
               hub.querySelector(`[data-cell="${name}"]`);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { x: r.x - box.x, y: r.y - box.y, w: r.width, h: r.height };
  };
  // Connects two tiles using the CLOSEST pair of edges (not always
  // right->left): this keeps the lines short and clean, no matter where a tile
  // was dragged. Arrowhead at the target (marker).
  // fanIndex/fanTotal: when several arrows enter the same box, their entry
  // points are spread along the target edge (side by side, not on top of each
  // other). offset = position in [-1..1] around the edge midpoint.
  const edge = (fromName, toName, fanIndex, fanTotal) => {
    const a = cellRect(fromName), b = cellRect(toName);
    if (!a || !b) return "";
    const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 };
    const bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    const dx = bc.x - ac.x, dy = bc.y - ac.y;
    // Fan spread: -1..1 (single arrow -> 0).
    const spread = (fanTotal && fanTotal > 1)
      ? ((fanIndex - (fanTotal - 1) / 2) / ((fanTotal - 1) / 2)) : 0;
    let x1, y1, x2, y2, horiz;
    if (Math.abs(dx) >= Math.abs(dy)) {   // mostly horizontal
      horiz = true;
      x1 = dx >= 0 ? a.x + a.w : a.x; y1 = ac.y;
      x2 = dx >= 0 ? b.x : b.x + b.w;
      y2 = bc.y + spread * (b.h * 0.33);   // spread entry along the vertical edge
    } else {                               // mostly vertical
      horiz = false;
      x1 = ac.x; y1 = dy >= 0 ? a.y + a.h : a.y;
      x2 = bc.x + spread * (b.w * 0.33);   // spread entry along the horizontal edge
      y2 = dy >= 0 ? b.y : b.y + b.h;
    }
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const c = horiz ? `C ${mx} ${y1}, ${mx} ${y2},` : `C ${x1} ${my}, ${x2} ${my},`;
    return `<path d="M ${x1} ${y1} ${c} ${x2} ${y2}" marker-end="url(#flow-ah)"/>`;
  };

  const sources = ["charts-sync", "charts-hitparade", "charts-flashback", "charts-energy", "charts-recommend", "charts-songrequest"];
  const getters = ["charts-download", "charts-upgrade"];
  // Arrowhead: small, filled, in the line colour (subtle).
  let paths = `<defs><marker id="flow-ah" viewBox="0 0 10 10" refX="8" refY="5" ` +
    `markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">` +
    `<path d="M0,0 L10,5 L0,10 z" fill="#5a8fe0"/></marker></defs>`;
  // Sources -> getter (download). Fan out the entry points so the arrows enter
  // download side by side instead of on top of each other.
  const activeSources = sources.filter(cellRect);
  activeSources.forEach((s, i) => { paths += edge(s, "charts-download", i, activeSources.length); });
  // Getters -> slskd (two arrows -> fan out).
  const activeGetters = getters.filter(cellRect);
  activeGetters.forEach((g, i) => { paths += edge(g, "slskd", i, activeGetters.length); });
  // slskd -> import -> navidrome (each individually).
  paths += edge("slskd", "charts-import");
  paths += edge("charts-import", "navidrome");

  svg.innerHTML = paths;
}
window.addEventListener("resize", () => requestAnimationFrame(drawFlowLines));
window.addEventListener("orientationchange", () => requestAnimationFrame(drawFlowLines));

// Remembers the manually dragged positions per tile (only for this session -
// a reload resets them). Key = data-cell name.
const _dragPos = {};

// Expanded state per tile, so the 15s refresh (render rebuilds the tiles) does
// NOT collapse an open box again. Key = data-cell name.
const _openState = {};
// How long an expanded box stays open before it auto-closes (only when the
// mouse is NOT over it). On a phone (no hover) always after this time.
const AUTO_CLOSE_MS = 8000;

// Makes the flow tiles draggable with mouse/touch. The move uses a CSS
// transform (the base layout stays intact); after each move the connection
// lines are redrawn so they stick to the tiles. A small movement counts as a
// click (expand), a larger one as a drag.
function enableDrag() {
  const hub = document.querySelector(".flow-hub");
  if (!hub) return;
  // Re-apply the remembered positions after a re-render.
  hub.querySelectorAll(".flow-cell").forEach(cell => {
    const name = cell.getAttribute("data-cell");
    const p = name && _dragPos[name];
    if (p) cell.style.transform = `translate(${p.x}px, ${p.y}px)`;
  });

  const isNarrow = () => window.matchMedia("(max-width: 760px)").matches;

  hub.querySelectorAll(".flow-cell").forEach(cell => {
    if (cell._dragBound) return;      // bind only once
    cell._dragBound = true;
    const name = cell.getAttribute("data-cell");

    // --- Expand + auto-close ----------------------------------------------
    // On expand keep it open and only auto-close after AUTO_CLOSE_MS - but ONLY
    // when the mouse is not over the tile. As long as the cursor is over it, it
    // stays open; when it leaves, the timer (re)starts. On a phone (no hover)
    // it closes after the time. A cell can contain MULTIPLE tiles (report zone:
    // watchdog/dashboard/digest in ONE flow-cell). So expand/collapse, hover
    // and auto-close work per TILE (data-svc), not per cell - otherwise a click
    // on one of the stacked tiles would always expand the first one.
    const tiles = Array.from(cell.querySelectorAll(".tile.svc"));
    if (tiles.length) {
      const svcName = (t) => t.getAttribute("data-svc") || name;
      const scheduleClose = (t) => {
        clearTimeout(t._closeTimer);
        // slskd is the central hub: stays open until the user clicks it
        // THEMSELVES - NO auto-close (not even after hover/mouseleave).
        if (svcName(t) === "slskd") return;
        // Do not close while the mouse is over it (desktop).
        if (t._hover) return;
        t._closeTimer = setTimeout(() => {
          if (!t._hover) closeTile(t);
        }, AUTO_CLOSE_MS);
      };
      const openTile = (t) => {
        t.classList.add("open");
        _openState[svcName(t)] = true;    // remember across re-render
        scheduleClose(t);
        requestAnimationFrame(drawFlowLines);
      };
      const closeTile = (t) => {
        t.classList.remove("open");
        _openState[svcName(t)] = false;
        clearTimeout(t._closeTimer);
        requestAnimationFrame(drawFlowLines);
      };
      // For the drag/click logic: determine the specific clicked tile.
      cell._toggleTile = (target) => {
        const t = target && target.closest(".tile.svc");
        if (!t || !cell.contains(t)) return;
        if (t.classList.contains("open")) closeTile(t);
        else openTile(t);
      };

      tiles.forEach((tile) => {
        // Hover keeps it open (desktop); leaving restarts the close timer.
        tile.addEventListener("mouseenter", () => {
          tile._hover = true;
          clearTimeout(tile._closeTimer);
        });
        tile.addEventListener("mouseleave", () => {
          tile._hover = false;
          if (tile.classList.contains("open")) scheduleClose(tile);
        });

        // If the box was already open (from _openState via re-render), arm the
        // auto-close timer. For slskd scheduleClose is a no-op (hub stays open
        // until the user clicks it themselves) - see above.
        if (tile.classList.contains("open")) scheduleClose(tile);
      });
    }

    // --- Phone: tap to expand/collapse only, NO drag (native scrolling free).
    if (isNarrow()) {
      if (tiles.length) {
        cell.addEventListener("click", (e) => {
          if (e.target.closest("a, button")) return;
          cell._toggleTile(e.target);
        });
      }
      return;
    }

    // --- Touch/pen on a WIDE screen (iPad, touch laptop): tap to expand.
    // This handler owns ONLY the tap: a short touch (<=10px of movement)
    // toggles the tile. A larger movement is either a scroll (handled natively)
    // or a drag (handled by the drag handler below, which commits once movement
    // passes the same >10px threshold - so a gesture is tap XOR drag, never
    // both). We use pointerdown+pointerup (NOT click): iOS Safari does not
    // reliably fire a `click` on a plain <div>, and a PointerEvent always
    // carries a correct pointerType, whereas a MouseEvent `click` has none.
    // A small move threshold distinguishes a tap from a scroll/drag.
    if (tiles.length) {
      let tStart = null;  // {x,y} of the touch/pen pointerdown
      cell.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse") return;   // mouse uses the drag handler
        tStart = { x: e.clientX, y: e.clientY };
      });
      cell.addEventListener("pointerup", (e) => {
        if (e.pointerType === "mouse") return;
        if (!tStart) return;
        const moved = Math.abs(e.clientX - tStart.x) + Math.abs(e.clientY - tStart.y);
        tStart = null;
        if (moved > 10) return;                  // was a scroll/swipe, not a tap
        if (e.target.closest("a, button")) return;
        if (cell._toggleTile) cell._toggleTile(e.target);
      });
    }

    // --- Wide screen: drag (mouse AND touch/pen) + click-to-expand --------
    // Mouse commits to a drag immediately on pointerdown (there is no native
    // scroll gesture to protect) and uses a 5px click threshold. Touch/pen must
    // NOT commit on pointerdown: a plain touch may be a scroll or a tap, and
    // grabbing the pointer early would block native scrolling (the old "UI
    // hangs" bug on iOS). So for touch/pen we only track the start point and
    // commit to a drag once movement passes a >10px threshold - the same
    // boundary the wide-screen tap handler above uses to reject a tap, so a
    // gesture is EITHER a tap (<=10, handled there) OR a drag (>10, handled
    // here), never both. Once committed we capture the pointer and call
    // preventDefault() on every move to suppress the browser's own scroll.
    cell.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;        // primary button only
      const isMouse = e.pointerType === "mouse";
      const downTarget = e.target;       // which tile was clicked
      const start = { x: e.clientX, y: e.clientY };
      const base = _dragPos[name] ? { ..._dragPos[name] } : { x: 0, y: 0 };
      let moved = false;       // mouse: passed the 5px click threshold
      let committed = false;   // touch/pen: passed the drag threshold and captured
      // Mouse commits right away; touch/pen waits until the drag threshold.
      if (isMouse) {
        cell.setPointerCapture(e.pointerId);
        cell.classList.add("dragging");
        committed = true;
      }

      const onMove = (ev) => {
        const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
        const dist = Math.abs(dx) + Math.abs(dy);
        if (isMouse) {
          if (!moved && dist < 5) return; // click threshold
          moved = true;
        } else {
          // Touch/pen: below the drag threshold leave the browser free to
          // scroll (and let the tap handler decide on pointerup).
          if (!committed && dist <= 10) return;
          if (!committed) {
            committed = true;
            cell.setPointerCapture(ev.pointerId);
            cell.classList.add("dragging");
          }
          // Suppress native scroll while actively dragging a tile.
          ev.preventDefault();
          moved = true;
        }
        const nx = base.x + dx, ny = base.y + dy;
        _dragPos[name] = { x: nx, y: ny };
        cell.style.transform = `translate(${nx}px, ${ny}px)`;
        requestAnimationFrame(drawFlowLines);
      };
      const onUp = () => {
        cell.removeEventListener("pointermove", onMove);
        cell.removeEventListener("pointerup", onUp);
        // Only release capture / remove the class if we actually committed.
        if (committed) {
          cell.releasePointerCapture(e.pointerId);
          cell.classList.remove("dragging");
        }
        // Mouse only: NO movement = click -> expand/collapse the CLICKED tile
        // (pointer capture would swallow a normal click event, so we toggle it
        // ourselves here). downTarget points at the specific tile - so in the
        // report stack it hits the right one, not always the first. For
        // touch/pen the separate wide-screen tap handler
        // above owns the toggle, so we must NOT also toggle here.
        if (isMouse && !moved && cell._toggleTile) cell._toggleTile(downTarget);
        requestAnimationFrame(drawFlowLines);
      };
      // passive:false so preventDefault() is honoured for touch drag.
      cell.addEventListener("pointermove", onMove, { passive: false });
      cell.addEventListener("pointerup", onUp);
    });
  });
}

function render(d) {
  document.getElementById("updated").textContent =
    t("updated.refreshed", {time: new Date().toLocaleTimeString()});

  // --- Connections (UNIFIED overview of all external/dependent services with
  //     consistent colour semantics) ---
  // Colour semantics via the existing tile(cls) classes:
  //   ok    (green)  = reachable / valid
  //   err   (red)    = configured, but not reachable / invalid
  //   muted (grey)   = not configured
  //   warn  (yellow) = reachable, but limited (e.g. iTunes throttled)
  // This shows at a glance ALL possible connections AND their state.
  const ext = d.external || {};
  // Each role group is a full-width label plus its OWN tile grid (.conn-grid).
  // See the .conn-group / .conn-grid CSS for why we don't span a label across
  // the main grid (auto-fill makes grid-column:1/-1 collapse to one cell).

  // --- Group 1: local services (own containers on the LAN) ----------------
  const local = [];

  // slskd (LAN, own live check d.slskd).
  const sl = d.slskd || {};
  local.push(tile(sl.ok ? "ok" : "err", t("tile.title.slskd"), [
    sl.ok ? t("tile.slskd.connected") : t("tile.slskd.disconnected"),
    t("tile.slskd.status", {state: sl.state || "?"}),
    sl.downloads_active != null ? t("tile.slskd.active_downloads", {n: sl.downloads_active}) : "",
    sl.detail || "",
  ].filter(Boolean)));

  // Lidarr (LAN, own live check d.lidarr; optional -> muted without config).
  const li = d.lidarr || {};
  local.push(tile(!li.configured ? "muted" : (li.ok ? "ok" : "err"), t("tile.title.lidarr"), [
    !li.configured ? t("tile.not_configured") : (li.ok ? t("tile.reachable") : t("tile.not_reachable")),
    li.detail || "",
  ].filter(Boolean)));

  // --- Group 2: chart sources (external APIs/streams the music comes from) -
  const sources = [];

  // Deezer (WAN, live ping). Heals charts-sync red -> yellow.
  const dz = ext.deezer || {};
  sources.push(tile(dz.ok ? "ok" : "err", t("tile.title.deezer"), [
    dz.ok ? t("tile.reachable") : t("tile.not_reachable"),
    dz.detail || "",
  ].filter(Boolean)));

  // Last.fm (WAN, live ping; needs an API key). Without a key -> muted, never red.
  const lf = ext.lastfm || {};
  sources.push(tile(!lf.configured ? "muted" : (lf.ok ? "ok" : "err"), t("tile.title.lastfm"), [
    !lf.configured ? t("tile.lastfm.no_api_key") : (lf.ok ? t("tile.reachable") : t("tile.not_reachable")),
    lf.detail || "",
  ].filter(Boolean)));

  // FLASHBACK FM (WAN, GraphQL live check). Heals charts-flashback red -> yellow;
  // a dead persisted-query hash -> red (then fetch a fresh FLASHBACK_HASH).
  const fb = ext.flashback || {};
  sources.push(tile(!fb.configured ? "muted" : (fb.ok ? "ok" : "err"), t("tile.title.flashback"), [
    !fb.configured ? t("tile.flashback.no_hash") : (fb.ok ? t("tile.reachable") : t("tile.not_reachable")),
    fb.detail || "",
  ].filter(Boolean)));

  // Energy (NRJ): Icecast stream of the Swiss NRJ channels that charts-energy
  // reads. Not in use (ENERGY_ENABLED=false) -> muted, same as FLASHBACK; in
  // use -> reachable (ok) / not reachable (err). Sits next to FLASHBACK FM so
  // the two radio sources stay together.
  const en = ext.energy || {};
  sources.push(tile(!en.configured ? "muted" : (en.ok ? "ok" : "err"), t("tile.title.energy"), [
    !en.configured ? t("tile.not_in_use") : (en.ok ? t("tile.reachable") : t("tile.not_reachable")),
    en.detail || "",
  ].filter(Boolean)));

  // Swiss Hitparade (hitparade.ch, WAN scrape source). Not in use
  // (HITPARADE_ENABLED=false) -> muted; otherwise reachable/not reachable.
  const hp = ext.hitparade || {};
  sources.push(tile(!hp.configured ? "muted" : (hp.ok ? "ok" : "err"), t("tile.title.hitparade"), [
    !hp.configured ? t("tile.not_in_use") : (hp.ok ? t("tile.reachable") : t("tile.not_reachable")),
    hp.detail || "",
  ].filter(Boolean)));

  // --- Group 3: helper services (external, not a chart source) ------------
  const helpers = [];

  // iTunes (WAN, live ping; only info for cover art). NEVER err: reachable -> ok,
  // throttled (429/403) but reachable -> warn, not reachable -> muted.
  const it = ext.itunes || {};
  let itCls = "muted";
  if (it.ok) itCls = it.throttled ? "warn" : "ok";
  helpers.push(tile(itCls, t("tile.title.itunes"), [
    it.ok ? t("tile.reachable") : t("tile.not_reachable"),
    it.detail || "",
  ].filter(Boolean)));

  // MusicBrainz (WAN, live ping). Metadata helper (year resolution for
  // charts-energy/-flashback), NOT a chart source -> helper service. Not in use
  // (MB_ENABLED=false) -> muted, like FLASHBACK/Last.fm/Pushover.
  // MusicBrainz is a free, rate-limited community service with frequent brief
  // outages (503/timeout). It is only a non-critical helper (year resolution
  // with a decade-midpoint fallback), so an unreachable ping softens to warn
  // (amber), NOT err (red) - like iTunes, which is never red. muted when off.
  const mb = ext.musicbrainz || {};
  let mbCls = "muted";
  if (mb.configured) mbCls = mb.ok ? "ok" : "warn";
  helpers.push(tile(mbCls, t("tile.title.musicbrainz"), [
    !mb.configured ? t("tile.not_in_use") : (mb.ok ? t("tile.reachable") : t("tile.not_reachable")),
    mb.detail || "",
  ].filter(Boolean)));

  // ListenBrainz (WAN, live ping). Provides recommendations for charts-recommend,
  // no charts -> helper service. Heals charts-recommend red -> yellow.
  const lb = ext.listenbrainz || {};
  helpers.push(tile(lb.ok ? "ok" : "err", t("tile.title.listenbrainz"), [
    lb.ok ? t("tile.reachable") : t("tile.not_reachable"),
    lb.detail || "",
  ].filter(Boolean)));

  // Pushover (WAN, real validate call d.external.pushover instead of just a
  // config flag). ok=green (valid), err=red (invalid), muted=grey (not conf.).
  const pu = ext.pushover || {};
  // pu.detail is intentionally DROPPED here: the client already renders the
  // verdict (valid/invalid), so showing the server detail too would double the
  // sentence in the tile (see collector.py comment).
  helpers.push(tile(!pu.configured ? "muted" : (pu.ok ? "ok" : "err"), t("tile.title.pushover"), [
    !pu.configured ? t("tile.pushover.not_configured")
                   : (pu.ok ? t("tile.pushover.valid") : t("tile.pushover.invalid")),
  ].filter(Boolean)));

  // Render each group as: full-width label + its own tile grid.
  const groupBlock = (key, tiles) =>
    `<div class="conn-group">${t(key)}</div>` +
    `<div class="conn-grid">${tiles.join("")}</div>`;
  document.getElementById("connections").innerHTML =
    groupBlock("conn.group.local", local) +
    groupBlock("conn.group.sources", sources) +
    groupBlock("conn.group.helpers", helpers);

  // Service -> external source(s): which live checks may heal a stored "error"
  // of a service. charts-recommend draws from ListenBrainz (+ Last.fm, if used),
  // charts-sync from Deezer + Last.fm. Services without a mapping keep the old
  // hard red rule. iTunes + Pushover are deliberately NOT here -> they heal NO
  // service red (iTunes = best-effort cover art, Pushover = notification sink).
  const EXT_SOURCES = {
    "charts-recommend": ["listenbrainz", "lastfm"],
    "charts-sync": ["deezer", "lastfm"],
    "charts-flashback": ["flashback"],
  };

  // --- Services (container status + run statistics) ---
  const svcEl = document.getElementById("services");
  // Fixed order along the processing chain (not alphabetical), so the services
  // are listed the way the data flows through them.
  const ORDER = ["slskd", "charts-sync", "charts-hitparade", "charts-flashback",
                 "charts-energy",
                 "charts-download",
                 "charts-import", "charts-upgrade", "charts-recommend",
                 "charts-songrequest", "charts-digest", "charts-watchdog",
                 "charts-dashboard", "charts-config"];
  // Short description per service, translated (desc.* keys). The service name
  // (with hyphens) is mapped to underscores for the key.
  const DESC = {
    "slskd": t("desc.slskd"),
    "charts-sync": t("desc.charts_sync"),
    "charts-hitparade": t("desc.charts_hitparade"),
    "charts-download": t("desc.charts_download"),
    "charts-import": t("desc.charts_import"),
    "charts-upgrade": t("desc.charts_upgrade"),
    "charts-flashback": t("desc.charts_flashback"),
    "charts-energy": t("desc.charts_energy"),
    "charts-recommend": t("desc.charts_recommend"),
    "charts-songrequest": t("desc.charts_songrequest"),
    "charts-digest": t("desc.charts_digest"),
    "charts-watchdog": t("desc.charts_watchdog"),
    "charts-dashboard": t("desc.charts_dashboard"),
    "charts-config": t("desc.charts_config"),
  };
  // Emoji per service - the same as in the Pushover titles, so the dashboard
  // and push stay consistent. Services without an entry get a neutral 🎵.
  const ICON = {
    "slskd": "🔽",
    "charts-sync": "🎵",
    "charts-hitparade": "🇨🇭",
    "charts-download": "⬇️",
    "charts-import": "📥",
    "charts-upgrade": "⬆️",
    "charts-flashback": "📻",
    "charts-energy": "⚡",
    "charts-recommend": "🎧",
    "charts-songrequest": "🙋",
    "charts-digest": "📨",
    "charts-watchdog": "🐕",
    "charts-dashboard": "📊",
    "charts-config": "\ud83e\udde9",
  };
  // Translated labels for the cumulative "total" counters.
  const TOTAL_LABEL = {
    imported: t("total.imported"), enqueued: t("total.enqueued"),
    upgraded: t("total.upgraded"), rejected: t("total.rejected"),
    cleaned: t("total.cleaned"), retried: t("total.retried"),
    requests: t("total.requests"), digests: t("total.digests"),
  };
  // Builds the HTML tile for ONE service (status + statistics). Factored out so
  // the services can be arranged as a flow (with arrows/stages) instead of a
  // flat grid. Returns "" when the service is not known at all (no container +
  // no status).
  // Short "what -> where" label per service (always visible in the tile).
  const FLOW_LABEL = {
    "charts-sync": t("flow.charts_sync"),
    "charts-hitparade": t("flow.charts_hitparade"),
    "charts-flashback": t("flow.charts_flashback"),
    "charts-energy": t("flow.charts_energy"),
    "charts-recommend": t("flow.charts_recommend"),
    "charts-songrequest": t("flow.charts_songrequest"),
    "charts-download": t("flow.charts_download"),
    "charts-upgrade": t("flow.charts_upgrade"),
    "slskd": t("flow.slskd"),
    "charts-import": t("flow.charts_import"),
    "charts-digest": t("flow.charts_digest"),
    "charts-watchdog": t("flow.charts_watchdog"),
    "charts-dashboard": t("flow.charts_dashboard"),
  };

  // Builds the service tile: COMPACT (traffic light + what->where + last/next,
  // always visible) + an expandable DETAIL block (container state, last run,
  // message, totals, scan progress) that appears on click/tap.
  // Returns "" when the service is not known at all.
  function svcTile(name) {
    const ct = (d.containers || {})[name] || {};
    const st = (d.services || {})[name] || null;
    if (!(name in (d.containers || {})) && !st) return "";
    const isManual = name === "charts-songrequest"; // manual entry point

    // Traffic-light / tile colour. A run error is NOT hard red when a mapped,
    // configured external source is currently reachable (-> yellow "running again").
    let cls = ct.ok ? "ok" : (ct.state === "restarting" ? "warn" : "err");
    let healLine = "";
    if (st && st.status === "error") {
      const sources = EXT_SOURCES[name];
      if (sources) {
        const liveOk = sources.some(s => {
          const chk = ext[s];
          if (!chk || chk.configured === false) return false;
          return chk.ok === true;
        });
        if (liveOk) {
          cls = "warn";
          healLine = `<span class="s-run">${t("svc.heal_recovered")}</span>`;
        } else {
          cls = "err";
          healLine = `<span class="s-err">${t("svc.heal_unreachable")}</span>`;
        }
      } else {
        cls = "err";
      }
    }
    // Disabled/empty hash: idle -> grey (muted), NEVER red. Deliberately placed
    // AFTER the error/heal block so no later branch overwrites cls again (an
    // idle service does not run through the error block anyway).
    if (st && st.status === "idle") cls = "muted";

    // --- COMPACT lines (always visible) ---
    const label = (ICON[name] ? ICON[name] + " " : "") + name;
    const flowLabel = FLOW_LABEL[name] || (DESC[name] || "");
    // "last · next" line.
    let whenLine = "";
    if (st) {
      if (st.status === "running") {
        const since = st.last_run_start ? ago(st.last_run_start) : "";
        const runTxt = since ? t("svc.running_since", {since}) : t("svc.running");
        whenLine = `<span class="s-run">${runTxt}</span>`;
      } else {
        const parts = [];
        if (st.last_run_end) parts.push(t("svc.last_run_ago", {ago: ago(st.last_run_end)}));
        if (st.next_run) parts.push(t("svc.next", {label: nextRunLabel(st.next_run)}));
        whenLine = parts.join(" · ");
      }
    }

    // --- DETAIL lines (expandable) ---
    const det = [];
    let state = ct.state;
    if (ct.health && ct.health !== "none") state += " / " + ct.health;
    det.push(t("svc.container", {state}));
    if (st) {
      const runCls = st.status === "ok" ? "" : (st.status === "error" ? "s-err" : "s-run");
      if (st.status !== "running" && st.last_run_end) {
        det.push(`<span class="${runCls}">` +
                 t("svc.last_run_line", {ago: ago(st.last_run_end),
                                         status: st.status ? ` (${st.status})` : ""}) +
                 "</span>");
      } else if (st.status !== "running") {
        det.push(`<span class="muted-txt">${t("svc.no_run_yet")}</span>`);
      }
      if (healLine) det.push(healLine);
      if (st.status === "idle") det.push(`<span class="muted-txt">${t("svc.idle", {message: st.message || t("svc.deactivated")})}</span>`);
      else if (st.message) det.push(t("svc.message", {message: st.message}));
      if (st.next_run && st.status !== "running") det.push(t("svc.next_prefix", {label: nextRunLabel(st.next_run)}));
      if (st.totals) {
        const tot = Object.entries(st.totals)
          .filter(([k, v]) => typeof v === "number" && v > 0)
          .map(([k, v]) => `${v} ${TOTAL_LABEL[k] || k}`)
          .join(", ");
        if (tot) det.push(`<span class="muted-txt">${t("svc.totals_prefix", {items: tot})}</span>`);
      }
      // charts-upgrade: scan progress (checked / total MP3).
      const cnt = st.counters || {};
      if (typeof cnt.scan_total === "number" && cnt.scan_total > 0) {
        const seen = cnt.scan_seen || 0, tot = cnt.scan_total;
        const pct = Math.min(100, Math.round((seen / tot) * 100));
        const nf = (n) => n.toLocaleString("de-CH");
        det.push(
          `<div class="scan-prog">` +
          `<div class="scan-bar"><div class="scan-fill" style="width:${pct}%"></div></div>` +
          `<span class="scan-txt">${t("svc.scan_progress", {seen: nf(seen), total: nf(tot), pct})}</span>` +
          `</div>`);
      }
    } else {
      det.push(`<span class="muted-txt">${t("svc.no_stats")}</span>`);
    }
    if (DESC[name]) det.push(`<span class="desc">${DESC[name]}</span>`);

    // charts-upgrade: mini scan bar in the COMPACT view too.
    let compactExtra = "";
    if (st && st.counters && typeof st.counters.scan_total === "number" && st.counters.scan_total > 0) {
      const pct = Math.min(100, Math.round(((st.counters.scan_seen || 0) / st.counters.scan_total) * 100));
      compactExtra = `<div class="scan-bar compact"><div class="scan-fill" style="width:${pct}%"></div></div>`;
    }

    // Show report-zone services (digest/watchdog/dashboard) in the COMPACT
    // state without the "last · next" line, so all three tiles are the same
    // height (otherwise digest's run line makes the box taller -> uneven
    // spacing in the report zone). The full run info stays on expand.
    const REPORT_ZONE = ["charts-digest", "charts-watchdog", "charts-dashboard", "charts-config"];
    if (REPORT_ZONE.includes(name)) whenLine = "";

    const detailHtml = det.map(l => `<div class="line">${l}</div>`).join("");
    // "manual" pill at the top of the tile above the title (compact, spaced).
    const manualTag = isManual ? `<div class="svc-manual-tag">${t("svc.manual_tag")}</div>` : "";
    // data-svc: anchor for the SVG line overlay (position lookup).
    // Expanding is driven in enableDrag() (click without movement), so drag and
    // click do not get in each other's way.
    // The expanded state comes from _openState (stable across the 15s refresh).
    // slskd is open initially (central component), but only once as a default -
    // after that user interaction wins. If the user collapsed slskd, it stays
    // collapsed (no forced expand on re-render).
    if (name === "slskd" && _openState[name] === undefined) _openState[name] = true;
    const openByDefault = _openState[name] ? " open" : "";
    return `<div class="tile svc ${cls}${isManual ? ' manual' : ''}${openByDefault}" data-svc="${name}">` +
      manualTag +
      `<div class="t-title">${label}<span class="svc-amp"></span></div>` +
      (flowLabel ? `<div class="line flow-what">${flowLabel}</div>` : "") +
      (whenLine ? `<div class="line svc-when">${whenLine}</div>` : "") +
      compactExtra +
      `<div class="svc-detail">${detailHtml}</div>` +
      `</div>`;
  }

  // --- Hub layout: slskd is the CENTRAL component all downloads run through.
  //     The services are arranged in zones (CSS grid):
  //       sources -> getters -> [slskd hub] -> import -> Navidrome
  //     charts-songrequest = manual entry point (marked with a dashed border).
  //     watchdog + dashboard sit across below as monitoring.
  //     The connection lines are drawn AFTER rendering as an SVG overlay
  //     (drawFlowLines) so they adapt to the real tile positions (responsive:
  //     resize/orientation redraws).
  const SOURCES = ["charts-sync", "charts-hitparade", "charts-flashback", "charts-energy", "charts-recommend"];
  const MANUAL = ["charts-songrequest"];
  const GETTERS = ["charts-download", "charts-upgrade"];
  const known = (n) => (n in (d.containers || {})) || (d.services || {})[n];

  // Absolute default positions (as in the mock), in % of the flow area. x/y =
  // top-left corner of the tile. Set on render via inline style; below 760px
  // (phone) the CSS overrides them and stacks everything vertically.
  const LAYOUT = {
    "charts-sync":        { x: 1,  y: 2  },
    "charts-hitparade":   { x: 1,  y: 21 },
    "charts-flashback":   { x: 1,  y: 40 },
    "charts-energy":      { x: 1,  y: 59 },
    "charts-recommend":   { x: 1,  y: 78 },
    "charts-songrequest": { x: 40, y: 2  },
    "charts-download":    { x: 40, y: 31 },
    "charts-upgrade":     { x: 40, y: 50 },
    "slskd":              { x: 70, y: 32 },
    "charts-import":      { x: 40, y: 80 },
    "navidrome":          { x: 42, y: 103 },
    "report-zone":        { x: 70, y: 72 },
  };
  // Zone label per LEADER box -> goes INTO the cell, moves along when dragged.
  // The topmost box of a zone carries the label.
  const CELL_STAGE = {
    "charts-sync": t("stage.sources"),
    "charts-songrequest": t("stage.manual"),
    "charts-download": t("stage.getters"),
    "slskd": t("stage.downloader"),
    "charts-import": t("stage.import"),
  };
  const STAGE_LABELS = [];  // no free-standing labels anymore

  // Navidrome is NOT part of the stack (external target) -> a slim green pill
  // instead of a full tile, so it stands out as the end station.
  const navidromeTile =
    `<div class="flow-target-pill" data-svc="navidrome">${t("flow.navidrome_pill")}</div>`;

  // Build a positioned cell (absolute default pos from LAYOUT). If the box
  // carries its own zone label (CELL_STAGE), it is attached at the top and
  // moves along when dragged.
  const posCell = (name, inner, extraCls) => {
    const p = LAYOUT[name] || { x: 0, y: 0 };
    const cls = "flow-cell" + (extraCls ? " " + extraCls : "");
    const stage = CELL_STAGE[name]
      ? `<div class="flow-stage cell-stage">${CELL_STAGE[name]}</div>` : "";
    return `<div class="${cls}" data-cell="${name}" ` +
      `style="left:${p.x}%;top:${p.y}%">${stage}${inner}</div>`;
  };
  const cell = (name, extraCls) => known(name) ? posCell(name, svcTile(name), extraCls) : "";

  const stageHtml = STAGE_LABELS.map(s =>
    `<div class="flow-stage abs" style="left:${s.x}%;top:${s.y}%">${s.t}</div>`
  ).join("");

  // Monitoring & report: watchdog + dashboard + digest as ONE flex stack (fixed
  // gap via CSS gap -> guaranteed equal spacing, independent of the tile
  // height). The zone label sits IN the stack as a heading. The wrapper is ONE
  // flow-cell (draggable); the inner tiles are normal svcTile without their own
  // positioning. Spacing comes solely from the flex 'gap' of .report-stack (see
  // style.css). The inline-margin crutch once needed (against '.flow-cell
  // .tile{height:100%}') is gone: '.report-stack .tile{height:auto}' already
  // undoes the stretching. No wrapper <div> anymore, so the flex child is the
  // tile ITSELF and the gap applies cleanly (simply) - otherwise gap + margin
  // would add up to too large a spacing (visibly larger than the other groups
  // on the iPhone).
  const reportBox = (name) => (known(name) ? svcTile(name) : "");
  const reportInner =
    `<div class="flow-stage cell-stage">${t("stage.report")}</div>` +
    `<div class="report-stack">` +
      reportBox("charts-watchdog") +
      reportBox("charts-dashboard") +
      reportBox("charts-digest") +
      reportBox("charts-config") +
    `</div>`;
  const reportZone = posCell("report-zone", reportInner, "report-wrap");

  const allCells =
    cell("charts-sync") + cell("charts-hitparade") + cell("charts-flashback") + cell("charts-energy") + cell("charts-recommend") +
    cell("charts-songrequest") + cell("charts-download") + cell("charts-upgrade") +
    cell("slskd", "hub") + cell("charts-import") +
    posCell("navidrome", navidromeTile) +
    reportZone;

  svcEl.innerHTML =
    `<div class="flow-hub">` +
      `<svg class="flow-svg" aria-hidden="true"></svg>` +
      stageHtml + allCells +
    `</div>` +
    `<div class="flow-hint">${t("svc.flow_hint")}</div>`;

  // Draw the connection lines (after the DOM update) + enable drag.
  requestAnimationFrame(() => { enableDrag(); drawFlowLines(); });

  // --- Storage ---
  const s = d.storage || {};
  const lib = s.library || {};
  document.getElementById("storage").innerHTML = [
    tile("info", t("storage.library"),
      lib.artists == null
        ? [t("storage.counting")]
        : [t("storage.artists", {n: lib.artists.toLocaleString("de-CH")}),
           t("storage.albums", {n: (lib.albums ?? 0).toLocaleString("de-CH")}),
           t("storage.songs", {n: (lib.songs ?? 0).toLocaleString("de-CH")})]),
    tile("info", t("storage.charts_share"), [
      t("storage.files", {n: (s.charts_files ?? "–")}),
      fmtBytes(s.charts_bytes),
    ]),
    // Quarantine is normal (it is auto-emptied after 14 days anyway) - only
    // warn when it grows unusually large (> 2 GB).
    tile((s.rejected_bytes ?? 0) > 2e9 ? "warn" : "info", t("storage.quarantine"), [
      t("storage.quarantine_desc"),
      t("storage.files", {n: (s.rejected_files ?? "–")}),
      fmtBytes(s.rejected_bytes),
    ]),
  ].join("");

  // --- In progress (four honestly labelled panels) ---
  renderInProgress(d);
}

// HTML-escape helper for untrusted labels (song titles, filenames) injected via
// innerHTML into the tile rows.
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Renders the "In progress" section: four panels, each with an honesty badge.
// Only panel 1 (active downloads) is live; panels 2-4 are snapshot / result-
// record / last-run. The badge is driven by WHICH sub-object is rendered, so a
// snapshot can never be shown as live. Defensive: an older payload without
// `inflight` renders empty panels instead of throwing.
function renderInProgress(d) {
  const ip = d.inflight || {};
  const badge = (cls, key) =>
    `<span class="badge ${cls}">${t("inflight.badge." + key)}</span>`;
  const panelTitle = (emoji_key, badge_cls, badge_key) =>
    `${t(emoji_key)} ${badge(badge_cls, badge_key)}`;

  // Each panel is header + scrollable list + footer. The header and footer sit
  // OUTSIDE the scroll container (.ip-list) so only the list scrolls; the panel
  // keeps a fixed height regardless of how many entries there are. `head`/
  // `foot` are arrays of HTML fragments (each wrapped in a .line); `rows` is the
  // FULL list of entry rows. `emptyRow` is shown inside the list when there are
  // no rows so the box keeps its height and the graceful empty state stays.
  const line = (h) => `<div class="line">${h}</div>`;
  const ipPanel = (cls, title, head, rows, foot, emptyRow) =>
    `<div class="tile ip-panel ${cls}">` +
      `<div class="ip-head"><div class="t-title">${title}</div>${head.map(line).join("")}</div>` +
      `<div class="ip-list">${rows.length ? rows.join("") : line(emptyRow)}</div>` +
      (foot.length ? `<div class="ip-foot">${foot.map(line).join("")}</div>` : "") +
    `</div>`;

  const tiles = [];

  // Panel 1: Active downloads (LIVE).
  const act = ip.active || {};
  {
    const head = [`<span class="muted-txt">${t("inflight.active.subtitle")}</span>`];
    const rows = [];
    const foot = [];
    let cls, emptyRow;
    if (act.ok === false) {
      cls = "err";
      emptyRow = t("inflight.active.slskd_down");
    } else if (!act.items || act.items.length === 0) {
      cls = "muted";
      emptyRow = t("inflight.active.none");
    } else {
      cls = "ok";
      head.push(t("inflight.active.count", {n: act.count}));
      act.items.forEach(it => {
        const note = it.matched ? ""
          : ` <span class="muted-txt">${t("inflight.unmatched")}</span>`;
        let row = `<div class="ip-row">${esc(it.label)}${note}`;
        if (it.pct != null) {
          row += `<div class="scan-bar"><div class="scan-fill" ` +
                 `style="width:${it.pct}%"></div></div>`;
        }
        rows.push(row + `</div>`);
      });
      if (act.truncated) {
        const more = (act.count || 0) - act.items.length;
        foot.push(`<span class="muted-txt">${t("inflight.active.more", {n: more})}</span>`);
      }
    }
    tiles.push(ipPanel(cls, panelTitle("inflight.active.title", "badge-live", "live"), head, rows, foot, emptyRow));
  }

  // Panel 2: Queue / missing (SNAPSHOT of the last charts-sync run).
  const miss = ip.missing || {};
  {
    const head = [`<span class="muted-txt">${t("inflight.missing.subtitle")}</span>`];
    const rows = [];
    const foot = [];
    let cls, emptyRow;
    if (!miss.available || !miss.total) {
      cls = "muted";
      emptyRow = t("inflight.missing.none");
    } else {
      cls = "info";
      // Count line + "waiting to be downloaded" hint + snapshot age (status,
      // belongs in the non-scrolling header).
      head.push(`${t("inflight.missing.total", {n: miss.total})} ` +
        `<span class="muted-txt">(${t("inflight.missing.backlog_hint")})</span>`);
      if (miss.snapshot_at) {
        head.push(`<span class="muted-txt">` +
          t("inflight.missing.snapshot_at", {ago: ago(miss.snapshot_at)}) + `</span>`);
      }
      (miss.preview || []).forEach(e => {
        rows.push(`<div class="ip-row">${esc(e.artist)} \u2013 ${esc(e.title)}</div>`);
      });
      // Per-source breakdown as ONE clean wrapped footer line, labelled.
      if (miss.per_source && miss.per_source.length) {
        const parts = miss.per_source.map(ps =>
          t("inflight.missing.per_source", {source: esc(ps.source), n: ps.count}));
        foot.push(`<span class="muted-txt">` +
          t("inflight.missing.per_source_label", {parts: parts.join(" \u00b7 ")}) + `</span>`);
      }
    }
    tiles.push(ipPanel(cls, panelTitle("inflight.missing.title", "badge-snap", "snapshot"), head, rows, foot, emptyRow));
  }

  // Panel 3: Quarantine / rejected (result record; reason is run-level only).
  const rej = ip.rejected || {};
  const s = d.storage || {};
  {
    const head = [`<span class="muted-txt">${t("inflight.rejected.subtitle")}</span>`];
    const rows = [];
    const foot = [];
    let cls, emptyRow;
    if (!rej.count) {
      cls = "muted";
      emptyRow = t("inflight.rejected.none");
    } else {
      cls = (s.rejected_bytes ?? 0) > 2e9 ? "warn" : "info";
      head.push(t("inflight.rejected.count", {n: rej.count}));
      (rej.preview || []).forEach(e => {
        rows.push(`<div class="ip-row">${esc(e.name)} ` +
          `<span class="muted-txt">${ago(e.when)}</span></div>`);
      });
    }
    // The run-level import note is the footer status line (shown even when the
    // list is empty, so the honest "why" stays visible).
    if (rej.message) {
      foot.push(`<span class="muted-txt">` +
        t("inflight.rejected.message", {message: esc(rej.message)}) + `</span>`);
    }
    tiles.push(ipPanel(cls, panelTitle("inflight.rejected.title", "badge-snap", "snapshot"), head, rows, foot, emptyRow));
  }

  // Panel 4: Upgrade status (last run - not per-song live).
  const up = ip.upgrade || {};
  {
    const head = [`<span class="muted-txt">${t("inflight.upgrade.subtitle")}</span>`];
    const rows = [];
    const foot = [];
    let cls, emptyRow;
    if (!up.available) {
      cls = "muted";
      emptyRow = t("inflight.upgrade.none");
    } else {
      cls = "info";
      // The scan progress bar + "upgraded" count are run status, not per-file
      // entries, so they belong in the non-scrolling header (like the count
      // lines on the other panels). The list area holds only the placeholder.
      if (typeof up.scan_total === "number" && up.scan_total > 0) {
        const seen = up.scan_seen || 0;
        const pct = Math.min(100, Math.round((seen / up.scan_total) * 100));
        const nf = (n) => n.toLocaleString("de-CH");
        head.push(`<div class="scan-bar"><div class="scan-fill" style="width:${pct}%"></div></div>` +
          `<span class="scan-txt">` +
          t("inflight.upgrade.progress", {seen: nf(seen), total: nf(up.scan_total), pct}) +
          `</span>`);
      }
      if (typeof up.upgraded === "number") {
        head.push(t("inflight.upgrade.upgraded", {n: up.upgraded}));
      }
      // This panel has no per-file list by design (charts-upgrade reports only
      // a last-run summary). Always show an honest placeholder in the list area
      // so .ip-list keeps its height and the footer pins to the bottom like the
      // sibling panels, instead of floating mid-box.
      emptyRow = t("inflight.upgrade.placeholder");
      // "next run" is status → footer.
      if (up.next_run) {
        foot.push(`<span class="muted-txt">` +
          t("inflight.upgrade.next", {label: nextRunLabel(up.next_run)}) + `</span>`);
      }
    }
    tiles.push(ipPanel(cls, panelTitle("inflight.upgrade.title", "badge-run", "lastrun"), head, rows, foot, emptyRow));
  }

  document.getElementById("inprogress").innerHTML = tiles.join("");
}

function ago2future(iso) {
  const ts = Date.parse(iso);
  if (isNaN(ts)) return iso;
  const s = Math.floor((ts - Date.now()) / 1000);
  if (s <= 0) return t("time.soon");
  if (s < 60) return s + t("time.unit.s");
  if (s < 3600) return Math.floor(s/60) + t("time.unit.min");
  if (s < 86400) return Math.floor(s/3600) + t("time.unit.h");
  return Math.floor(s/86400) + t("time.unit.d");
}

// Label for the next scheduled run. Near times relative ("in 3 h"), far ones
// (> 24 h, e.g. the weekly charts-hitparade service) as an absolute date
// ("Sun, 05.10. 20:00") - for rare runs that is clearer than "in 6 d". If the
// time is in the past (stalled/overdue run), honestly show "overdue" instead
// of a misleading "soon".
function nextRunLabel(iso) {
  const ts = Date.parse(iso);
  if (isNaN(ts)) return iso;
  const s = Math.floor((ts - Date.now()) / 1000);
  if (s <= -60) return t("time.overdue");
  if (s < 3600) return t("time.in_prefix") + ago2future(iso); // < 1 h: relative (min)
  if (s < 86400) {
    // 1-24 h: hours AND minutes, so e.g. 1h50 does not appear as "1 h"
    // (otherwise it contradicts the actual interval). Full hour: just "h".
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return m ? t("time.in_h_m", {h, m}) : t("time.in_h", {h});
  }
  // >= 24 h: absolute date (weekday, day.month, time)
  const d = new Date(ts);
  const wd = t("time.weekday." + d.getDay());
  const pad = (n) => String(n).padStart(2, "0");
  return `${wd}, ${pad(d.getDate())}.${pad(d.getMonth() + 1)}. ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function tick() {
  const live = document.querySelector(".live");
  try {
    const r = await fetch("/api/status", {cache: "no-store"});
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
    // Success -> live dot green (pulsing). render() sets the timestamp.
    if (live) live.classList.remove("error");
  } catch (e) {
    document.getElementById("updated").textContent = t("updated.error");
    // Error -> live dot red (no longer pulsing). Signals that the data is NOT
    // fresh.
    if (live) live.classList.add("error");
  }
}

applyStaticI18n();   // populate the static head/body markup once on load
tick();
setInterval(tick, REFRESH * 1000);
</script>
</body>
